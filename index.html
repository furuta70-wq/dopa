ど複数の手掛かりを持たせるため","赤と緑は誰にとっても十分区別できるので、色だけで伝わることを補強して示すため","線や記号の種類を増やすほど装飾性が高まり、避難経路図を華やかに見せられるため","色と線種を重ねることで情報を意図的に複雑にし、注意深く読ませる時間を増やすため"],"correct":0,"why":"重要情報を色だけに依存させず、線種・形・文字など複数の手掛かりで示すと、色覚の違いや白黒印刷など条件が変わっても判別しやすくなる。"},{"subject":"美術","grade":"中3","unit":"環境・空間のデザイン","passage":"学校の中庭に、生徒や地域の人が使うベンチを設置する計画を立てている。","q":"この場所に合うベンチを考えるとき、組み合わせて検討したい条件は？","choices":["人の動線、日差しや木陰、座りやすさ、周囲の景観","座りやすさと材料だけを先に決め、設置位置は完成後に空いている場所から選ぶ","通行のしやすさを優先し、日差しや滞在のしやすさは利用者が調整するものとする","遠くからの目立ちやすさと大きさを優先し、周囲の景観や動線は二次的に考える"],"correct":0,"why":"環境・空間のデザインでは、物そのものだけでなく、利用者の動き、気候条件、使いやすさ、周囲との調和を関連付けて構想する。"},{"subject":"美術","grade":"中3","unit":"日本の美術文化・水墨表現","passage":"山水画で、近くの岩は濃い墨とかすれた筆致、遠くの山は水を多く含ませた淡い墨とにじみで表し、山と山の間には大きな余白を残している。","q":"この表現から、どのような空間の感じが生まれる？","choices":["近景と遠景で墨の調子や筆致を変え、余白も使うことで距離や空気の広がりを感じさせる","近景を濃く描いたことで、遠景の山も同じ濃さに見え、画面全体が平面的になる","余白が多いので、描かれている山や岩の前後関係は読み取れなくなる","にじみとかすれを同じ場所へ重ねることで、近景と遠景の差をなくしている"],"correct":0,"why":"濃淡、にじみ、かすれ、余白を組み合わせることで、一色の墨でも距離感や空気感を表現できる。ここでは近景と遠景の扱いの違いが効果につながっている。"},{"subject":"美術","grade":"中3","unit":"美術文化・比較鑑賞","passage":"同じ『町』を描いた二作品がある。Aは遠くの建物ほど小さくし、一点へ線を集めて奥行きを表す。Bは遠近の大きさを大きく変えず、形を平面的に配置している。","q":"二作品の空間表現の違いを、どう捉えるとよい？","choices":["遠近法と平面的配置という空間表現の違いが、どんな見え方や意図につながるか比較する","現実の見え方に近いAの方が、表現方法としてBより高い価値をもつと判断する","遠近感を弱くしたBは空間を表していないため、Aと比較する意味がない","異なる文化や時代の作品は基準が違うため、共通点や相違点を考えない"],"correct":0,"why":"比較鑑賞では、写実性だけで優劣を決めず、空間の捉え方や形・色の扱いがどのような印象や意味を生むかを考える。"},{"subject":"美術","grade":"中3","unit":"空間表現・インスタレーション","passage":"半透明の板を何枚も吊った作品がある。入口から見ると板が重なって一つの大きな面に見えるが、作品の間を歩くと板どうしのずれや、通り抜ける光の形が次々変わる。","q":"入口から見るだけでは、どの特徴を捉えにくい？","choices":["歩く位置によって、板の重なりや光の見え方が変わること","板が半透明の材料でつくられていること","作品が天井から吊られていること","入口から見たときに大きな面のように見えること"],"correct":0,"why":"この作品の重要な特徴は、鑑賞者が移動することで見え方が変わる点にある。一方向からだけでは、空間を移動して体験する変化を捉えにくい。"},{"subject":"美術","grade":"中3","unit":"デザインと社会","passage":"菓子箱AとBを試作した。\nA：材料120g・開封平均12秒・輸送試験の破損0件・表示を正しく読めた割合78％\nB：材料90g・開封平均7秒・輸送試験の破損0件・表示を正しく読めた割合94％","q":"このデータから、B案をどう評価できる？","choices":["今回の試験では保護性能を保ちつつ、材料量・開封時間・表示の読み取りやすさが改善している","材料量と開封時間は改善したが、破損が0件なので表示の読み取りやすさは比較できない","表示の読み取りやすさは改善したが、材料量が減ったため保護性能は低下したと判断できる","破損件数が同じなので、材料量や開封時間の違いを含めても二案の評価は同じになる"],"correct":0,"why":"今回のデータでは破損件数はどちらも0件で、Bは材料量が少なく、開封時間が短く、表示を正しく読めた割合も高い。複数の指標を合わせて評価する。"},{"subject":"美術","grade":"中3","unit":"鑑賞・批評と展示","passage":"「距離」をテーマに、①離れた二つの椅子の写真、②奥へ長く続く廊下の絵、③二つの塊を大きく離して置いた彫刻を展示する。","q":"三作品を関連付けて紹介する展示解説は？","choices":["写真の配置、絵の奥行き、彫刻の間隔という異なる方法で「距離」をどう表しているか比較する","三作品は同じ題名の展示に入るため、作者が表そうとした経験も同じだったと説明する","写真・絵画・彫刻は材料が異なるため、作品間では主題だけを比べ、造形上の方法は比べない","展示タイトルから意味を先に一つに決め、その意味に合う部分だけを各作品から取り出して説明する"],"correct":0,"why":"作品に実際に見える配置・奥行き・間隔を根拠に、異なる媒体が同じ「距離」という主題をどう表すか比較している。"}];


const HEALTH_CURRICULUM=[{"subject":"保健体育","grade":"中1","unit":"健康の成り立ち","passage":"健康は、本人の生活の仕方だけでなく、周囲の環境とも関わって成り立っている。","q":"健康状態を考えるとき、本人と環境の関係をどう捉える？","choices":["生活習慣や年齢など本人側の要因と、家庭・地域など環境側の要因が互いに影響すると考える","本人の生活習慣を中心に考え、家庭や地域の環境は病気になった後だけ関係すると考える","家庭や地域の環境を中心に考え、本人が選ぶ睡眠・食事・運動は影響が小さいと考える","病気の有無だけで健康を判断し、生活や環境は別の問題として扱う"],"correct":0,"why":"健康は本人の生活行動や発育・発達などと、家庭・地域・社会環境などが互いに関わって成り立つ。"},{"subject":"保健体育","grade":"中1","unit":"生活習慣と健康","passage":"テスト前の一週間を、次の四つの過ごし方で比べる。\nA：睡眠5時間・毎日2時間勉強・運動0分・朝食を抜く\nB：睡眠8時間・毎日1〜2時間勉強・20分歩く・三食をとる\nC：睡眠6時間・毎日2時間勉強・運動0分・夜食中心\nD：睡眠9時間・毎日3時間勉強・運動0分・朝食を抜く","q":"睡眠・食事・運動を極端に崩さず、学習時間も確保しているのはどの案？","choices":["A","B","C","D"],"correct":1,"why":"Bは学習時間を確保しながら、睡眠、三食、短時間の運動も組み合わせている。学習だけを増やすのではなく、生活全体のバランスを整えることが大切。"},{"subject":"保健体育","grade":"中1","unit":"体の発育・発達","passage":"4人の身長が大きく伸びた時期を記録した。Aさんは11〜12歳、Bさんは12〜13歳、Cさんは13〜14歳、Dさんは11〜13歳に伸びが目立った。","q":"この記録から、発育について何が言える？","choices":["大きく伸びる時期や続く長さには個人差がある","同じ学年なら大きく伸びる時期は全員一致する","伸び始める時期が早い人ほど、その後の発育も順調だと判断できる","伸びる時期の違いは本人の努力量だけで決まる"],"correct":0,"why":"4人で伸びが目立つ時期や期間が異なることから、発育の時期・程度には個人差があると分かる。早い・遅いを健康や優劣と直接結び付けることはできない。"},{"subject":"保健体育","grade":"中1","unit":"思春期の体の変化","passage":"思春期には、声変わり、体つきの変化、生殖機能の成熟などが見られる。また、気持ちの揺れや人との関わり方を意識することも増える。","q":"思春期の変化は、どのように捉えるとよい？","choices":["身体面と心理・社会面の変化が関わりながら進み、現れ方には個人差がある","身体の変化だけが思春期であり、気持ちや対人関係の変化は別問題である","同じ年齢なら同じ変化が同じ順序・速度で起こると考える","周囲より早い・遅いという一点だけで、発達上の問題の有無を判断する"],"correct":0,"why":"思春期は生殖機能を含む身体面だけでなく、心理面や対人関係の変化も含めて捉える。時期や進み方には個人差がある。"},{"subject":"保健体育","grade":"中1","unit":"心の健康・ストレス","passage":"発表が続いて緊張が抜けず、最近はよく眠れない。気持ちも落ち着かない。","q":"この状態を改善する行動として考えやすいのは？","choices":["睡眠の時間を確保し、軽い運動やリラクセーションを試し、続く場合は周囲にも相談する","平日の睡眠を減らして発表準備を進め、休日にまとめて眠ることで調整する","緊張を感じる場面をできるだけ避け、発表や人との会話そのものを減らしていく","以前効果があった対処法だけを続け、眠れない状態が変化しても方法は変えない"],"correct":0,"why":"ストレスへの対処は、休養・運動・リラクセーション・相談などを状況に応じて組み合わせる。睡眠不足や回避だけに偏らないことが重要。"},{"subject":"保健体育","grade":"中1","unit":"体つくり運動","passage":"授業の始めに、軽く体を動かしながら自分の体の状態を確かめ、仲間と声を掛け合った。","q":"この体ほぐしには、どのようなねらいがある？","choices":["心身の状態に気付き、気軽に体を動かす心地よさや仲間との交流を味わう","授業の始めから最大強度で運動し、その日の体力の限界を測る","技能の優劣を比較し、記録の順位を決めることを主な目的にする","仲間との関わりを避け、決められた動作を一人で正確に繰り返す"],"correct":0,"why":"体ほぐしの運動は、心と体の関係に気付き、体を動かす心地よさや仲間との交流を味わうことをねらいとする。競技記録や高強度そのものが主目的ではない。"},{"subject":"保健体育","grade":"中1","unit":"陸上競技・長距離走","passage":"1500m走で、自分に合ったペースを考えて走る。Aは最初だけ全力で走って大きく失速、Bは序盤からほぼ一定のペースで走った。","q":"1500mを大きく失速せず走るためのペース配分は？","choices":["目標に近いペースで入り、呼吸や疲労を見ながら大きく崩れない範囲で調整する","最初の300mを目標よりかなり速く入り、後半は余った体力に応じて速度を決める","近くを走る選手のペースに合わせ続け、自分の目標タイムや体力は基準にしない","前半をできるだけ遅く走り、残り300mだけで不足した時間を一気に取り戻す"],"correct":0,"why":"長距離走では、自分の体力と目標に応じたペースを設定し、呼吸や疲労の状態を見ながら大きな失速を避けることが安定した記録につながる。"},{"subject":"保健体育","grade":"中1","unit":"球技・ゴール型","passage":"味方がボールを持っている。自分は相手に近くマークされている。右前方には空いたスペースがあり、左側には別の味方がいる。","q":"味方のパスコースを増やすには、どこへ動く？","choices":["右前方の空いたスペースへ動き、マークを外しながら味方から見える位置を取る","ボール保持者へ一直線に近づき、自分を守る相手もボールの近くへ連れていく","左側の味方と同じ位置へ移動し、二人で同じパスコースを使う","相手の背後に隠れる位置を保ち、守備者が動くまでその場で待つ"],"correct":0,"why":"空いたスペースへ動いてマークを外し、ボール保持者から見える位置を取ると、新しいパスコースをつくれる。味方と同じ場所へ集まると選択肢は減りやすい。"},{"subject":"保健体育","grade":"中1","unit":"武道・安全と礼法","passage":"武道の学習では、技だけでなく、相手を尊重する態度や安全な練習の仕方も学ぶ。","q":"武道の練習で大切にしたい考え方は？","choices":["礼法を大切にし、相手と安全を確かめながら技能を高める","礼法は試合の前後だけ行えばよく、普段の練習では技能だけに集中する","慣れた相手との練習なら、安全確認より技の速さを優先する","上達を早めるため、習熟度にかかわらず難しい技から繰り返し試す"],"correct":0,"why":"武道では、技能の習得とともに相手を尊重する態度や礼法、安全への配慮を一体として学ぶ。経験の有無にかかわらず、安全確認や段階的な練習が必要。"},{"subject":"保健体育","grade":"中1","unit":"体育理論・スポーツの多様性","passage":"スポーツとの関わり方には、実際に競技する以外にもさまざまな形がある。","q":"スポーツへの多様な関わり方を表した組み合わせは？","choices":["する・みる・支える・知る","競う・勝つ・表彰される・記録を残す","走る・跳ぶ・投げる・泳ぐ","選手・監督・審判・観客"],"correct":0,"why":"スポーツとの関わり方は、実際に行う「する」、観戦する「みる」、運営や応援などで「支える」、歴史や方法を「知る」など多様。種目や役割の分類とは異なる。"},{"subject":"保健体育","grade":"中2","unit":"生活習慣病の予防","passage":"Aさんは夜更かしが続き、朝食を抜くことが多く、ほとんど運動していない。この生活が長く続いている。","q":"この生活を改善する計画として、続けやすいのは？","choices":["就寝時刻を少しずつ整え、朝食をとり、短時間の歩行などから運動を習慣化する","睡眠時間だけを十分に増やし、朝食を抜くことや運動不足は今のままにする","平日は今の生活を続け、休日に強い運動をまとめて行って不足分を補う","食事量だけを減らし、睡眠や運動の習慣は変えずに体重の変化だけを見る"],"correct":0,"why":"生活習慣病の予防では、食事・運動・休養や睡眠を関連付け、無理なく続けられる形で改善することが大切。"},{"subject":"保健体育","grade":"中2","unit":"喫煙・飲酒・薬物乱用と健康","passage":"喫煙・飲酒・薬物乱用の開始には、本人の心理状態だけでなく、周囲からの誘いや人間関係、社会環境などが影響することがある。","q":"誘われる場面も想定した予防として有効なのは？","choices":["健康への影響を知るだけでなく、断り方やその場を離れる方法、相談先も考えておく","健康への影響を十分知っていれば、誘われたときの断り方や相談先までは考えなくてよい","誘われたときに断る言葉だけ覚え、周囲の人間関係や相談できる相手は考えない","誘ってくる可能性のある人との関係を避けることを、予防の中心にする"],"correct":0,"why":"開始には知識だけでなく、周囲からの誘いなど社会的要因も関わる。知識、断る技能、相談できる環境を組み合わせて備えることが有効。"},{"subject":"保健体育","grade":"中2","unit":"交通事故と危険予測","passage":"雨の夕方、見通しの悪い交差点へ自転車で近づいている。路面は濡れ、周囲も暗くなっている。","q":"この交差点へ入る前の行動として適切なのは？","choices":["早めに速度を落とし、左右の見通しを確かめ、濡れた路面では停止距離が伸びることも見込む","ライトを点灯していれば見つけてもらえるので、速度は保ったまま交差点の直前で確認する","見通しを確保するため道路の中央寄りへ進み、交差点に入ってから車の有無を確認する","雨ではブレーキが効きやすくなると考え、乾いた日より短い距離で止まるつもりで進む"],"correct":0,"why":"雨・暗さ・見通しの悪さが重なる場面では、早めに減速して確認する。濡れた路面では止まりにくくなる点も危険予測に含める。"},{"subject":"保健体育","grade":"中2","unit":"自然災害と傷害の防止","passage":"地震後、避難所まで二つの経路がある。Aは近いが、途中にひび割れた塀と煙の出ている建物がある。Bは少し遠いが、広い道路を通り、倒壊物は確認されていない。","q":"避難するなら、どちらの経路を選ぶ？","choices":["距離だけでなく二次災害の危険を考え、状況が変わらなければBを選ぶ","Aは近いので、ひび割れた塀や煙より距離を優先してAを選ぶ","事前に決めた経路がAなら、周囲の状況が変わってもAから変更しない","煙や壊れた塀は揺れの後には危険でないため、経路判断に含めない"],"correct":0,"why":"地震後は余震・火災・倒壊などの二次災害を考える必要がある。経路は距離だけでなく、その時点の安全性を確認して選ぶ。"},{"subject":"保健体育","grade":"中2","unit":"応急手当・AED","passage":"人が倒れており、呼びかけても反応がない。周囲の安全を確かめ、119番通報とAEDの手配を頼んだ。","q":"AEDを使うとき、正しい対応は？","choices":["AEDの電源を入れ、音声・表示に従い、解析やショック時は傷病者から離れる","AEDを装着したら、心電図解析中も胸骨圧迫を続ける","AEDが到着したら、電気ショックの指示がなくても直ちにショックボタンを押す","AEDを一度使用したら、その後は救急隊到着まで胸骨圧迫を行わない"],"correct":0,"why":"AEDは音声・表示の指示に従って使用する。心電図解析や電気ショック時は誰も傷病者に触れず、ショック後または不要の指示後は胸骨圧迫を再開する。"},{"subject":"保健体育","grade":"中2","unit":"器械運動・学び方","passage":"マット運動で新しい技に挑戦している。動画を見ると、回転に入る前の姿勢が崩れると失敗しやすいことが分かった。","q":"動画で見つけた課題を改善する練習は？","choices":["補助を使って回転前の姿勢を安定させる易しい練習を行い、できてから完成技へつなげる","安全マットを使い、姿勢の課題は分けずに完成技の反復回数を増やして慣れる","回転前の姿勢は変えず、助走や勢いを強めることで回転不足だけを補う","動画で毎回別の修正点を選び、同じ条件で試して変化を比べる練習は行わない"],"correct":0,"why":"課題が回転前の姿勢にあると分かったので、その部分を安全な条件で取り出して練習し、安定してから完成技へつなげるのが効果的。"},{"subject":"保健体育","grade":"中2","unit":"陸上競技・リレー","passage":"リレーの受け渡しを計測した。\n方法A：受け手が止まって待つ → 受け渡し区間で0.8秒減速\n方法B：受け手が合図に合わせて加速する → 0.2秒減速","q":"この結果を踏まえ、バトンパスをどう改善する？","choices":["受け手が加速しながら、渡し手との距離と合図を合わせる練習をする","受け手は止まった方が確実なので、方法Aのまま受け渡し位置だけ変える","方法Bは速いので、合図をなくして各自の感覚だけで走り出す","受け渡しの減速は記録に影響しないので、どちらの方法でも同じ"],"correct":0,"why":"計測では方法Bの減速が小さい。受け手が加速しつつ、渡し手との距離や合図を合わせることで、速度を保ったバトンパスを目指せる。"},{"subject":"保健体育","grade":"中2","unit":"球技・ネット型","passage":"バドミントンで相手がコートの後方にいる。自分は前方でシャトルを打てる。","q":"相手を前後に動かすには、どこへ返す？","choices":["相手から遠い前方の空いた場所へ返し、前後に動かす","相手が後方にいるので、同じ後方へ深い球だけを続ける","相手の正面へ高く返し、相手が移動しなくても打てるようにする","サイドラインぎりぎりを狙うことだけを優先し、相手の位置は見ない"],"correct":0,"why":"ネット型では相手の位置と空いている場所を見て返球先を選ぶ。後方にいる相手に対して前方へ返すと、移動距離を大きくしやすい。"},{"subject":"保健体育","grade":"中2","unit":"ダンス・表現の工夫","passage":"4人で現代的なリズムのダンスをつくる。途中で曲のリズムが大きく変化する。","q":"曲の変化を生かしながら、まとまりを出すには？","choices":["リズムの変化に合わせ、動きの大きさ・速さ・方向や隊形にも変化をつける","まとまりを保つため、曲が変化しても動きの大きさと速さは一定にする","一人ひとりが別のリズムを選び、互いの動きや隊形は合わせない","リズムが変わる場所では全員が止まり、その後は最初と同じ動きを繰り返す"],"correct":0,"why":"現代的なリズムのダンスでは、音楽のリズムや構成を捉え、動き・方向・隊形などに変化をつけながら全体のまとまりをつくる。"},{"subject":"保健体育","grade":"中2","unit":"体育理論・運動の効果と学び方","passage":"運動やスポーツには、体力面だけでなく、気分転換や仲間との関係づくりなど様々な効果がある。","q":"運動やスポーツを学ぶとき、どの視点が大切？","choices":["自分の課題や目的を捉え、練習方法と安全を工夫しながら継続する","上級者と同じ練習内容・量を行えば、自分の課題を考えなくても同じ成果が得られる","身体への効果だけを評価し、気分や仲間との関わりは運動の価値に含めない","安全性より短時間での上達を優先し、負荷を高くするほどよい"],"correct":0,"why":"運動には身体的・心理的・社会的な効果があり、学習では自分の課題に合う方法を選び、安全を確保しながら改善することが重要。"},{"subject":"保健体育","grade":"中3","unit":"感染症の予防","passage":"学校で感染症対策を考え、①手洗い、②換気、③予防接種、④十分な休養、を組み合わせる案が出た。","q":"①〜④は、感染症予防のどの面に働きかける？","choices":["手洗い・換気は感染経路を減らし、予防接種や休養は免疫や体の状態に関わる","手洗い・換気・予防接種は主に感染経路を遮断し、休養だけが体の状態に働く","予防接種は病原体を環境から除去し、手洗いと換気は体内の免疫を直接高める","十分な休養は病原体をなくす対策なので、手洗いや換気と同じ働きをする"],"correct":0,"why":"感染症予防は一つの方法だけでなく、病原体・感染経路・体の抵抗力など異なる面へ働きかける対策を組み合わせて考える。"},{"subject":"保健体育","grade":"中3","unit":"保健・医療機関と医薬品","passage":"体調不良が続いているとき、友人が『前に病院でもらって余った薬があるから使えば』と言った。","q":"このとき、どう行動する？","choices":["必要なら受診し、処方薬は処方された本人が指示された量・回数で使う","症状が似ていれば、友人に処方された薬を同じ量だけ使用してよい","薬の効き目を早めたいときは、1回量を自己判断で増やしてから様子を見る","副作用が心配なら、医療機関や薬剤師に相談せず服用を中止・再開する"],"correct":0,"why":"医薬品は効果と副作用があり、用法・用量などを守る必要がある。処方薬は他人へ譲らず、体調不良が続く場合は医療機関や薬剤師など専門家へ相談する。"},{"subject":"保健体育","grade":"中3","unit":"健康と環境・体温調節","passage":"気温33℃、湿度70％の日に屋外で運動する。開始前から、普段より汗が乾きにくいと感じている。","q":"高温多湿を考えると、運動計画をどう変える？","choices":["汗が蒸発しにくく体熱を逃がしにくいため、強度を下げ、休憩と水分補給を増やす","汗の量が多ければ十分に放熱できていると考え、予定どおりの強度で続ける","湿度が高いほど汗は早く蒸発すると考え、水分補給の回数を少なくする","開始前に多めに水分をとれば運動中の体温上昇は防げるため、休憩は減らす"],"correct":0,"why":"高湿度では汗が蒸発しにくく、気化熱による放熱が進みにくい。高温多湿時は運動強度、休憩、水分補給を調整する必要がある。"},{"subject":"保健体育","grade":"中3","unit":"飲料水・空気の衛生","passage":"学校の衛生管理について、二つの記録がある。\n水道：見た目は透明だが、定期的に水質を測定している。\n教室：見た目に変化がなくても、人数が多い時間は空気の状態を測り、必要に応じて換気している。","q":"二つの管理に共通する考え方はどれ？","choices":["見た目だけでは分からない衛生状態を測定などで確かめ、必要な管理を行う","透明な水やにおいのない空気なら、測定や管理を行う必要はない","水と空気は自然に安全な状態へ戻るため、施設側の管理は不要である","衛生管理では一度基準を満たせば、その後の変化を確かめる必要はない"],"correct":0,"why":"水も空気も見た目だけでは安全性を判断できないことがある。測定・基準・換気などを使って状態を確かめ、衛生的に保つことが共通している。"},{"subject":"保健体育","grade":"中3","unit":"廃棄物と環境","passage":"家庭や学校などからは、毎日の生活に伴ってさまざまな廃棄物が生じる。","q":"廃棄物を適正に処理する必要があるのはなぜ？","choices":["不適切な放置や処理による衛生上の問題や環境汚染を防ぐため","家庭から出る量が少ないごみでも、種類に関係なく同じ方法で処理するため","自然に分解される物質は河川や土壌へ戻せば、衛生管理が不要になるため","廃棄物を生活空間から見えない場所へ移せば、健康への影響がなくなるため"],"correct":0,"why":"廃棄物は種類に応じて分別・収集・処理し、病原体、悪臭、有害物質などによる健康被害や環境汚染を防ぐ必要がある。"},{"subject":"保健体育","grade":"中3","unit":"体つくり運動・体力の高め方","passage":"持久力を高めたいAさんは、毎回その日の体調を無視して同じ強度で走り続けようとしている。","q":"持久力を高める練習計画として考えやすいのは？","choices":["体調を見ながら週数回の運動を続け、強度や時間を少しずつ調整し、休養日も設ける","毎日同じ高い強度で走り、疲労が残っていても予定した量をこなす","週1回だけ最大強度で長時間走り、それ以外の日は運動量を記録しない","日ごとに強度と時間を大きく変え、前回の疲労や記録とは関連付けずに練習する"],"correct":0,"why":"体力を高めるには、目的・体力・体調に応じて強度・時間・頻度を設定し、回復のための休養も含めて継続する。"},{"subject":"保健体育","grade":"中3","unit":"陸上競技・ハードル走","passage":"ハードル走で、ハードルの直前ごとに歩幅が合わず減速している。","q":"記録を伸ばすには、どの練習が有効？","choices":["自分に合う踏切位置とハードル間の歩数を確かめ、走速度を保てるリズムを反復する","歩幅の個人差をなくすため、上級者と同じ歩数・同じ踏切位置へ無理に合わせる","ハードル直前で十分に減速し、高く跳び越えることを最優先するリズムへ変える","毎回違う歩数でハードル間を走り、踏切位置を固定しないことを中心に練習する"],"correct":0,"why":"ハードル走では必要以上に高く跳ぶのではなく、自己に合う踏切位置とハードル間の歩数を整え、走速度を保てるリズムを身に付けることが記録向上につながる。"},{"subject":"保健体育","grade":"中3","unit":"球技・ゴール型の作戦","passage":"バスケットボールの速攻で3人対2人になった。ボールを持つ選手に相手が寄り、右側の味方には守備者がついていない。","q":"この数的優位を生かすなら、どう攻める？","choices":["空いている右側の味方へパスできる状況を生かし、守備を広げてシュートにつなげる","ボール保持者がそのまま2人の守備の間へ入り、数的優位を使わず1対2をつくる","3人がボールの近くへ集まり、守備者も一か所へ集める","守備者の位置を見ず、決めた場所から早い段階でシュートする"],"correct":0,"why":"3対2では、守備者が一人へ寄れば他の味方が空きやすい。数的優位を生かし、守備を動かしてよりよいシュート機会をつくる。"},{"subject":"保健体育","grade":"中3","unit":"水泳・複数の泳法","passage":"これまで学んだ泳法を使い、複数の泳法で続けて泳ぐ課題に取り組む。","q":"複数の泳法で続けて泳ぐなら、どう取り組む？","choices":["自分の技能・体力に合う泳法とペースを組み合わせ、フォームと安全を確認しながら続ける","最初の泳法で全力を出し切り、後半は泳法やフォームを維持できなくてもよい","泳法を切り替えるたびにプールサイドで十分休んでから、次の泳法を始める","記録を縮めることを優先し、疲労や周囲の泳者への安全確認は後回しにする"],"correct":0,"why":"複数泳法では、技能や体力に応じて泳法・ペースを工夫し、フォームや安全を保ちながら継続することが重要。"},{"subject":"保健体育","grade":"中3","unit":"体育理論・スポーツ文化","passage":"国際的なスポーツ大会では、国や地域の異なる選手が競い、観客やボランティアなど多くの人も関わっている。","q":"この大会に見られる、スポーツの文化的な意義は？","choices":["競技する人だけでなく、観戦・運営・支援を通して人が交流し、文化を共有する機会になること","国際大会では勝敗と記録が共通なので、地域ごとの文化や交流は競技とは切り離して考えること","スポーツ文化は選手と指導者がつくるもので、観客やボランティアはその外側にいること","共通の競技規則があれば文化的背景も同じになるため、国や地域の違いを意識しなくてよいこと"],"correct":0,"why":"スポーツは「する」だけでなく「みる・支える」など多様な関わりを通して人々の生活や交流に関わり、文化として共有される。"}];

const TECHHOME_CURRICULUM=[{"subject":"技術家庭","grade":"中1","unit":"技術・材料と加工","passage":"学校で使う小さな収納棚をつくる。置く場所、載せる物の重さ、使用期間は決まっている。","q":"材料を選ぶとき、何を基準にする？","choices":["強度・重さ・加工しやすさ・耐水性などを、収納棚の使用条件に照らして比較する","強度を最優先し、重さや加工のしやすさは製作後に考える","加工しやすさを最優先し、載せる物の重さは材料選択には使わない","見た目が設置場所に合えば、材料の性質はどれを選んでも同じと考える"],"correct":0,"why":"材料選択では一つの性質だけでなく、必要な強さ、重さ、加工性、耐水性などを使用目的・条件と対応させて比較する。"},{"subject":"技術家庭","grade":"中1","unit":"技術・構造と設計","passage":"長方形の木枠を横から押すと、平行四辺形のように変形しやすかった。","q":"木枠を変形しにくくするには、どう補強する？","choices":["対角線方向に部材を加えて三角形をつくり、枠の変形を抑える","横材を長くして長方形を横長にし、変形する余地を減らす","四隅の接合を回転しやすくし、力を逃がせるようにする","縦材だけを細くし、枠全体を軽くして変形しにくくする"],"correct":0,"why":"三角形は辺の長さが変わらなければ形が変わりにくい。長方形の枠に筋交いを入れて三角形をつくると、横からの力による変形を抑えやすい。"},{"subject":"技術家庭","grade":"中1","unit":"技術・加工と安全","passage":"板材をのこぎりで切る。切断線は正しくけがいてある。","q":"安全に正確に切るには、どう作業する？","choices":["材料を固定し、切断線と刃の位置を確認しながら、切断方向に手を置かず作業する","材料を手で支えながら、切断線を見るため顔を刃の進行方向へ近づける","切断を速く終えるため、最初から強い力で大きくのこぎりを動かす","刃がずれたときは、動かしたまま反対の手で刃の向きを戻す"],"correct":0,"why":"安全で正確な切断には、材料の固定、切断線の確認、刃の進行方向から手を離すことが基本。速度より安定した姿勢と操作を優先する。"},{"subject":"技術家庭","grade":"中1","unit":"技術・設計と製作","passage":"幅300mmの板から、幅95mmの部品を3枚切り出す計画を立てている。切断すると刃の厚さの分だけ材料も失われる。","q":"切り始める前に、何を確認しておく？","choices":["切りしろを含めた必要寸法と、どの順に切るかを製作前に確認する","95mm×3＝285mmなので、刃の厚さに関係なく15mm余ると考える","板の端から順に95mmずつ切り、最後の部品だけ不足したら寸法を変える","部品の向きや加工順序は材料使用量に影響しないため、切断時に決める"],"correct":0,"why":"切断では刃の厚さ分の材料が失われる。部品寸法だけでなく切りしろ、配置、加工順序まで見積もってから加工する必要がある。"},{"subject":"技術家庭","grade":"中1","unit":"技術・生物育成","passage":"同じ野菜を育てた。\n鉢A：日当たり6時間・水やり1日1回・平均気温24℃・よく成長\n鉢B：日当たり2時間・水やり1日1回・平均気温24℃・成長が遅い","q":"日当たりの影響を確かめるには、次にどう試す？","choices":["鉢Bの日当たりだけをAに近づけ、水やりと温度はそろえて成長の変化を比べる","鉢Bの日当たりはそのままにし、水やりだけをAより増やして成長の変化を比べる","鉢Bの日当たりと水やりを同時に増やし、どちらが効いたかは区別せず結果だけを見る","鉢Bを別の種類の野菜に植え替え、Aとの成長速度の違いから日当たりの影響を判断する"],"correct":0,"why":"原因を確かめるには、疑っている条件だけを変え、他の条件をできるだけそろえて比較する。今回の記録では日当たりが主な違いなので、それを検証する。"},{"subject":"技術家庭","grade":"中1","unit":"家庭・中学生の食事","passage":"昼食が『ご飯と鶏のから揚げだけ』になっている日が続いている。","q":"この昼食に何を加えると、栄養の偏りを減らせる？","choices":["野菜・海藻・きのこなどを使う副菜を加え、食品群の偏りを小さくする","主菜のから揚げを増やし、野菜類の不足をエネルギー量で補う","主食のご飯を減らし、副菜を加えず一日の摂取量だけを調整する","昼食の組合せは変えず、夕食で一種類の食品を多く食べて補う"],"correct":0,"why":"主食と主菜だけに偏った食事には、副菜などを加えて食品の種類を広げるのが基本。栄養のバランスは一種類の食品の量だけでは整えにくい。"},{"subject":"技術家庭","grade":"中1","unit":"家庭・食品の選択","passage":"要冷蔵の食品に「消費期限 9月20日」「10℃以下で保存」とある。9月20日に食べる予定だが、購入後に店から家まで持ち歩いた時間がある。","q":"期限内でも安全性を考えるとき、日付以外に特に確認したいのは？","choices":["購入後の保存温度と、冷蔵されていなかった時間の長さ","開封したときのにおいや見た目だけ","購入した店で同じ商品がどのくらい売れているか","パッケージの色と商品の内容量"],"correct":0,"why":"消費期限は、表示された保存方法を守って保存した場合を前提としている。期限内でも、購入後の温度や常温に置かれた時間など保存状態を確かめる必要がある。"},{"subject":"技術家庭","grade":"中1","unit":"家庭・調理と衛生","passage":"生の鶏肉を切った直後のまな板で、そのまま加熱せず食べるトマトを切ろうとしている。","q":"食中毒を防ぐには、どうする？","choices":["生肉用とそのまま食べる食品の器具を分けるか、器具を十分に洗浄・消毒してから使う","見た目に肉片が残っていなければ、同じ器具をそのまま使う","トマトを水洗いすれば、まな板から付く微生物も十分に取り除けると考える","まな板を乾いた布で拭けば、生肉からの二次汚染を防げると考える"],"correct":0,"why":"生肉の微生物が器具を介して加熱しない食品へ移る「二次汚染」を防ぐ必要がある。器具の使い分けや十分な洗浄・消毒が基本。"},{"subject":"技術家庭","grade":"中1","unit":"家庭・衣服の手入れ","passage":"衣服の取扱い表示を確認すると「30℃を限度に洗濯機可」「塩素系漂白不可」「タンブル乾燥不可」とあった。","q":"表示に合った手入れ方法は？","choices":["30℃以下で洗濯機を使い、塩素系漂白剤とタンブル乾燥は避ける","40℃の湯で洗濯機を使い、汚れが残れば塩素系漂白剤を使う","30℃以下なら洗濯できるので、乾燥方法や漂白の表示は確認しなくてよい","洗濯機可の表示があるため、温度・漂白・乾燥の条件は自由に選べる"],"correct":0,"why":"取扱い表示は洗濯だけでなく、温度・漂白・乾燥など複数の条件を示す。今回は30℃以下の洗濯機使用はできるが、塩素系漂白とタンブル乾燥は避ける必要がある。"},{"subject":"技術家庭","grade":"中1","unit":"家庭・安全な住まい","passage":"地震に備えて自分の部屋を見直した。背の高い本棚がベッドのすぐ横にあり、出入口の近くにも物が積まれている。","q":"部屋の安全性を高めるには、どう改善する？","choices":["本棚を固定し、ベッドや出入口をふさがない位置へ移し、重い物は下段へ置く","本棚を出入口の近くへ移し、倒れたときに扉を押さえるよう配置する","転倒防止は行わず、本を上段へ集めて床に物を置かないようにする","家具は動かさず、地震時にすぐ本棚を手で支えられるようベッドを近づける"],"correct":0,"why":"地震対策では家具の固定、重い物の配置、就寝場所、避難経路を一体で見直す。家具が転倒・落下して人や出口をふさがないようにする。"},{"subject":"技術家庭","grade":"中2","unit":"技術・電気エネルギー","passage":"ある機器に12Vの電圧を加えたところ、0.5Aの電流が流れている。","q":"この機器の電力は何W？","choices":["3W","6W","12W","24W"],"correct":1,"why":"電力は『電圧×電流』で求める。12V×0.5A＝6W。電気機器を扱うときは、電圧・電流・電力の関係を数量で捉えることが大切。"},{"subject":"技術家庭","grade":"中2","unit":"技術・エネルギー変換","passage":"同じ明るさ800lmの照明A・Bを比べる。\nA：消費電力10W\nB：消費電力6W","q":"同じ800 lmを得る照明として、電力を効率よく使っているのは？","choices":["A。10W使う方が、同じ明るさを出すための電力に余裕があるから","B。6WでAと同じ800 lmを得ており、明るさ当たりの消費電力が小さいから","AとB。明るさが同じなら、消費電力が違っても効率は同じだから","使用時間が示されていないため、消費電力と明るさからは効率を比べられない"],"correct":1,"why":"明るさが同じ800 lmなので、より小さい消費電力で同じ働きをしているBの方が電力利用の効率は高いと判断できる。"},{"subject":"技術家庭","grade":"中2","unit":"技術・機構","passage":"歯数12の小さい歯車が、歯数36の大きい歯車を回している。小さい歯車を3回転させる。","q":"大きい歯車は、どちら向きに何回転する？","choices":["同じ向きに3回転する","反対向きに3回転する","反対向きに1回転する","同じ向きに1回転する"],"correct":2,"why":"かみ合う歯車は反対向きに回る。歯数が3倍の歯車は回転数が1/3になるので、小さい歯車3回転に対して大きい歯車は1回転する。"},{"subject":"技術家庭","grade":"中2","unit":"技術・情報セキュリティ","passage":"「アカウント確認が必要です」というメールが届いた。送信者名は普段使うサービス名だが、リンク先を長押しすると公式サイトと少し違うドメインが表示された。","q":"次にどう行動するのが安全？","choices":["メールのリンクは開かず、公式アプリや自分で入力した公式URLから状態を確認する","送信者名が正しいので、ドメインの違いは気にせずリンクからログインする","見た目が公式画面に似ているか確かめるため、リンクを開いてIDだけ入力する","友人へ同じリンクを送り、先にログインできるか試してもらう"],"correct":0,"why":"送信者名や画面は偽装できる。リンク先のドメインが不審なら、そのリンクを使わず、自分で確認した公式アプリ・公式サイトから状態を確認する。"},{"subject":"技術家庭","grade":"中2","unit":"技術・計測と制御の基礎","passage":"換気扇は「温度が30℃以上」かつ「人がいる」ときだけONになる。現在は32℃だが、人感センサーは「人なし」を示している。","q":"この条件に従うと、換気扇はどうなる？","choices":["OFF。二つの条件のうち「人がいる」を満たしていないから","ON。温度が30℃以上なら、もう一方の条件に関係なく動くから","ON。32℃と「人なし」を合わせると、条件を一つ満たしたことになるから","ONとOFFを交互に繰り返す。条件が二つある場合は自動的に切り替わるから"],"correct":0,"why":"「AかつB」は二つの条件を両方満たしたときだけ真になる。32℃は温度条件を満たすが、人感センサーが「人なし」なので換気扇はOFF。"},{"subject":"技術家庭","grade":"中2","unit":"家庭・献立と栄養","passage":"朝はパンと牛乳、昼はうどんだけだった。夕食では一日の食事全体のバランスも考えたい。","q":"一日の食事を整える夕食はどれ？","choices":["ご飯、焼き魚、野菜ときのこのみそ汁、果物","ご飯、鶏のから揚げ、フライドポテト、清涼飲料","うどん、パン、おにぎり、果汁飲料","焼き肉、ハンバーグ、卵焼き、牛乳"],"correct":0,"why":"朝・昼が主食中心に偏っているので、夕食では主食・主菜・副菜を組み合わせ、野菜や果物など食品の種類を広げると一日のバランスを整えやすい。"},{"subject":"技術家庭","grade":"中2","unit":"家庭・衣服の選択","passage":"汗を多くかく運動用の衣服を選ぶ。着心地や手入れのしやすさも重視したい。","q":"運動用の衣服は、何を基準に選ぶ？","choices":["吸湿性・速乾性・伸縮性・サイズ・手入れ方法を、運動時の条件に照らして比べる","価格が高いほど高機能と考え、素材表示やサイズを確認せず選ぶ","速乾性だけを優先し、動きやすさや肌触りは運動用衣服の条件から外す","デザインが好みなら、運動後の手入れや洗濯方法は購入後に考える"],"correct":0,"why":"衣服は使用目的に応じて必要な性能が変わる。運動用なら吸湿・速乾、動きやすさ、サイズ、手入れなどを複数の観点から選ぶ。"},{"subject":"技術家庭","grade":"中2","unit":"家庭・家族と家庭生活","passage":"家族4人のその日の予定は次のとおり。\n父：18時帰宅、料理が得意\n母：20時帰宅、朝は30分余裕あり\n姉：17時帰宅、18時30分から部活のオンラインミーティング\n弟：16時帰宅、ごみ集積所へ行ける\nその日の家事は「夕食準備」「洗濯物の取り込み」「17時までのごみ出し」。","q":"予定と得意なことを生かせる分担はどれ？","choices":["弟が17時までのごみ出し、姉が洗濯物の取り込み、父が帰宅後の夕食準備を担当する","姉がごみ出しと夕食準備を担当し、父は洗濯物だけを20時ごろ取り込む","母が帰宅後に三つの家事をまとめて担当し、ほかの家族は予定を変えない","毎日の担当を固定し、その日の帰宅時刻や締切に合わなくても同じ分担を続ける"],"correct":0,"why":"家事の締切、帰宅時刻、得意なことを組み合わせると、弟・姉・父へ分担する案が最も実行しやすい。公平さは単純な個数ではなく、状況に応じた負担調整で考える。"},{"subject":"技術家庭","grade":"中2","unit":"家庭・消費生活と契約","passage":"動画配信サービスは「初月0円。2か月目から月980円で自動更新。3か月目の更新日の前日までに解約すれば、3か月目の料金はかからない」と表示されている。","q":"2か月目まで利用し、3か月目の更新日の前日に解約した。支払総額はいくら？","choices":["0円","980円","1,960円","2,940円"],"correct":1,"why":"1か月目は無料で、2か月目は980円。3か月目の更新前に解約しているので、支払総額は980円。契約では「無料」という表示だけでなく、更新時期と解約条件まで確認する。"},{"subject":"技術家庭","grade":"中2","unit":"家庭・持続可能な消費","passage":"同じ用途の商品AとBがある。Aは安いが壊れたとき修理しにくい。Bは少し高いが部品交換ができ、長く使える設計になっている。","q":"購入時だけでなく、使い続ける期間まで含めて比べるなら？","choices":["価格、耐久性、修理のしやすさ、必要な性能、廃棄時の負担を自分の使い方に合わせて比べる","購入価格が低いAを選び、故障後の買い替え回数は購入後の問題として比較に入れない","部品交換できるBを選べば、使用頻度や必要な性能を確認しなくても環境負荷は小さいと判断する","長く使えるかは耐久性だけで決まるので、修理の可否や廃棄時の負担は別に考える"],"correct":0,"why":"持続可能な消費では購入時の価格だけでなく、必要性、耐久性、修理性、使用期間、廃棄など製品のライフサイクルを考えて選ぶ。"},{"subject":"技術家庭","grade":"中3","unit":"技術・ネットワークと双方向性","passage":"システムAは、学校からのお知らせを利用者が読むだけで、利用者から情報は送れない。\nシステムBは、利用者が観察記録を送信し、サーバーに保存された内容が他の利用者の画面にも更新表示される。","q":"Bを「双方向」といえる決め手は何？","choices":["利用者が受信するだけでなく送信もでき、その情報が処理されて別の利用者へ返されること","同じ情報を複数の利用者が別々の端末から読むことができること","送られた情報をサーバーへ保存し、送信した本人だけが後で読み返せること","文字だけでなく画像も表示でき、画面に多くの情報を並べられること"],"correct":0,"why":"双方向性のポイントは、利用者が受信するだけでなく送信し、その情報が処理・共有されること。表示形式や機器の新しさでは決まらない。"},{"subject":"技術家庭","grade":"中3","unit":"技術・プログラムの改善","passage":"人が近づき、かつ周囲が暗いときだけ照明を点灯するプログラムを作った。しかし『明るいのに人が近づくと点灯する』不具合が起きた。","q":"不具合の原因を切り分けるため、最初に何を確かめる？","choices":["明るさセンサーの値と条件式を記録し、どの入力で誤作動するか同じ条件で再現する","点灯時間を短くして不具合が目立ちにくい設定にし、原因の確認は後回しにする","プログラム全体を書き直し、元の条件と修正版の動作を const RAW=[];
const QUESTIONS=[...JAPANESE_CURRICULUM,...MATH_CURRICULUM,...SOCIAL_CURRICULUM,...ENGLISH_CURRICULUM,...SCIENCE_CURRICULUM,...MUSIC_CURRICULUM,...ART_CURRICULUM,...HEALTH_CURRICULUM,...TECHHOME_CURRICULUM].map((q,i)=>({...q,id:i}));
const QUESTION_BANK_QA_VERSION="96.0";
function validateQuestionBank(){
 const errors=[],warnings=[];
 if(QUESTIONS.length!==270)errors.push(`問題数 ${QUESTIONS.length}/270`);
 const subjectCounts={},gradeCounts={},seenQ=new Map(),slotCounts=[0,0,0,0];
 for(const q of QUESTIONS){
   subjectCounts[q.subject]=(subjectCounts[q.subject]||0)+1;
   const g=`${q.subject}:${q.grade}`;gradeCounts[g]=(gradeCounts[g]||0)+1;
   if(q.id!==QUESTIONS.indexOf(q))errors.push(`${q.id}: id sequence`);
   if(!SUBJECTS[q.subject])errors.push(`${q.id}: subject`);
   if(!['中1','中2','中3'].includes(q.grade))errors.push(`${q.id}: grade`);
   if(!Array.isArray(q.choices)||q.choices.length!==4)errors.push(`${q.id}: choices`);
   if((q.choices||[]).some(x=>!String(x).trim()))errors.push(`${q.id}: empty choice`);
   if(!Number.isInteger(q.correct)||q.correct<0||q.correct>3)errors.push(`${q.id}: correct`);
   if(new Set((q.choices||[]).map(x=>String(x).trim())).size!==4)errors.push(`${q.id}: duplicate choices`);
   if(!String(q.q||'').trim())errors.push(`${q.id}: empty question`);
   if(!String(q.why||'').trim())errors.push(`${q.id}: empty explanation`);
   if(q.figure)errors.push(`${q.id}: figure must be absent`);
   const nq=(String(q.passage||'')+'|'+String(q.q||'')).replace(/[\s　「」『』、。！？?]/g,'').toLowerCase();
   if(seenQ.has(nq))errors.push(`${q.id}: duplicate question with ${seenQ.get(nq)}`); else seenQ.set(nq,q.id);
   const shown=choiceOrder(q),origs=shown.map(x=>x.orig);
   if(shown.length!==4||new Set(origs).size!==4||origs.some(x=>x<0||x>3))errors.push(`${q.id}: displayed choice mapping`);
   const correctSlots=shown.map((x,i)=>x.orig===q.correct?i:-1).filter(i=>i>=0);
   if(correctSlots.length!==1)errors.push(`${q.id}: displayed correct count ${correctSlots.length}`); else slotCounts[correctSlots[0]]++;
 }
 for(const s of Object.keys(SUBJECTS||{}))if((subjectCounts[s]||0)!==30)errors.push(`${s}: ${subjectCounts[s]||0}/30`);
 for(const s of Object.keys(subjectCounts))for(const g of ['中1','中2','中3'])if((gradeCounts[`${s}:${g}`]||0)!==10)errors.push(`${s}${g}: ${gradeCounts[`${s}:${g}`]||0}/10`);
 if(Math.max(...slotCounts)-Math.min(...slotCounts)>1)warnings.push(`displayed correct slots ${slotCounts.join('/')}`);
 if(errors.length){console.error('QUESTION BANK QA FAILED',errors);return false}
 if(warnings.length)console.warn('QUESTION BANK QA WARNINGS',warnings);
 console.info('QUESTION BANK QA OK',{total:QUESTIONS.length,slotCounts,version:QUESTION_BANK_QA_VERSION});
 return true
}
