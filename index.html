<title>ドパ学</title>
<style>
:root{

  --top:calc(58px + var(--safe-t));--nav:calc(60px + var(--safe-b));
  --bg:#f7f7f8;--surface:#fff;--text:#17181c;--muted:#777b84;--line:#e9e9ec;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;color:var(--text)}
body{display:grid;place-items:center}.hidden{display:none!important}button{font:inherit}
#app{position:relative;width:min(100vw,430px);height:100dvh;background:var(--bg);overflow:hidden;user-select:none}
@media(min-width:720px){#app{height:min(930px,96vh);border-radius:28px;box-shadow:0 30px 90px #0008}}

/* header: looks like a real social feed first, a game second */
.top{position:absolute;z-index:50;left:0;right:0;top:0;height:var(--top);padding-top:var(--safe-t);background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.topbar{height:58px;display:flex;align-items:center;padding:0 12px;gap:10px}.brand{font-size:22px;font-weight:1000;letter-spacing:-.06em;white-space:nowrap}.brand span{color:var(--accent)}
.feedTabs{display:flex;gap:13px;margin-left:8px;height:100%;align-items:center}.feedTab{height:100%;border:0;background:transparent;color:#9699a0;font-size:11px;font-weight:850;padding:2px 0 0;position:relative}.feedTab.active{color:#202126}.feedTab.active:after{content:"";position:absolute;left:2px;right:2px;bottom:9px;height:2px;border-radius:3px;background:var(--accent)}
.topActions{margin-left:auto;display:flex;align-items:center;gap:9px}.dopaPill{height:30px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:0 10px;display:flex;align-items:center;gap:5px;font-size:10px;font-weight:950;color:#555961}.dopaDot{width:7px;height:7px;border-radius:50%;background:var(--accent)}.headIcon{position:relative;width:31px;height:31px;border:0;background:transparent;display:grid;place-items:center;color:#33363d;padding:4px}.headIcon svg{width:21px;height:21px}.notifBadge{position:absolute;right:0;top:0;min-width:15px;height:15px;padding:0 4px;border-radius:999px;background:#e94462;color:white;font-size:8px;font-weight:1000;display:none;place-items:center;border:2px solid white}.notifBadge.on{display:grid}

/* feed / 3-card deck */
#feed{position:absolute;z-index:1;left:0;right:0;top:var(--top);bottom:var(--nav);overflow:hidden;touch-action:none;background:var(--bg)}
#deck{position:absolute;inset:0;height:300%;display:flex;flex-direction:column;will-change:transform;transform:translate3d(0,0,0)}
.post{position:relative;flex:0 0 33.333333%;height:33.333333%;min-height:0;background:#fff;display:flex;flex-direction:column;overflow:hidden;border-bottom:7px solid var(--bg);contain:layout paint style}
.postHead{height:48px;padding:6px 12px;display:flex;align-items:center;gap:9px;flex:0 0 auto}.avatar{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--subjectSoft);border:1px solid #e4e5e7;color:var(--subjectInk);font-size:12px;font-weight:1000;flex:0 0 auto}.avatarRing{position:absolute;inset:-3px;border-radius:50%;border:2px solid transparent;pointer-events:none}.author{min-width:0}.userline{display:flex;align-items:center;gap:5px;min-width:0}.username{font-size:11px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.verified{display:none;width:13px;height:13px;border-radius:50%;background:var(--accent);color:#fff;font-size:8px;font-weight:1000;place-items:center}.postmeta{font-size:8px;color:#8e9198;margin-top:2px;font-weight:700}.followMini{margin-left:auto;border:0;background:transparent;color:#6a6e76;font-size:9px;font-weight:900;padding:6px}.more{font-size:20px;line-height:1;color:#5e6168}

.poll{position:relative;margin:0 11px;border:1px solid #e3e4e7;border-radius:18px;background:#fbfbfc;min-height:0;flex:1;display:flex;flex-direction:column;overflow:hidden}.pollTop{padding:13px 14px 9px;display:flex;align-items:center;justify-content:space-between;gap:8px}.subjectTag{font-size:8px;font-weight:950;color:var(--subjectInk);background:var(--subjectSoft);border:1px solid #e4e5e8;padding:5px 8px;border-radius:999px}.reachTag{min-width:0;font-size:8px;color:#858991;font-weight:800;display:flex;align-items:center;gap:5px;opacity:.0;transform:translateY(-3px);transition:.2s ease}.reachTag.show{opacity:1;transform:none}.liveDot{width:5px;height:5px;border-radius:50%;background:#e94462;box-shadow:0 0 0 3px #e9446215}
.question{padding:4px 14px 10px;font-size:clamp(21px,6vw,28px);font-weight:1000;line-height:1.23;letter-spacing:-.035em;color:#18191d}.questionSub{padding:0 14px 10px;font-size:9px;color:#8a8d94;line-height:1.45}.choices{padding:0 11px 12px;display:grid;gap:7px;margin-top:auto}.choice{position:relative;min-height:42px;border:1px solid #dfe0e3;background:#fff;border-radius:11px;padding:7px 64px 7px 10px;text-align:left;display:flex;align-items:center;gap:9px;color:#22252b;cursor:pointer;touch-action:manipulation;overflow:hidden}.choice:active{background:#f6f6f7}.letter{width:27px;height:27px;border:1px solid #d7d8dc;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:1000;color:#62656d;background:#fafafa;flex:0 0 auto}.choiceText{font-size:11px;font-weight:850;line-height:1.25;min-width:0}.pollBar{position:absolute;left:0;top:0;bottom:0;width:0;background:color-mix(in srgb,var(--subject) 9%,transparent);transition:width .45s cubic-bezier(.2,.8,.2,1);z-index:0}.choice>*:not(.pollBar){position:relative;z-index:1}.percent{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:950;color:#70737b;opacity:0;z-index:2}.choice.showPoll .percent{opacity:1}.choice.correct{border-color:#75bb9f;background:#f7fcf9}.choice.correct .letter{background:#20865e;color:white;border-color:#20865e}.choice.correct:after{content:"✓";position:absolute;right:38px;top:50%;transform:translateY(-50%);font-weight:1000;color:#20865e;font-size:12px}.choice.miss{border-color:#e05268!important;background:linear-gradient(180deg,#fff4f6,#ffe8ed)!important;box-shadow:0 0 0 3px rgba(224,82,104,.11),0 10px 24px rgba(185,35,65,.12)!important}.choice.miss .letter,.choice.miss .choiceText{opacity:.42}.choice.miss:after{content:"×";position:absolute;right:38px;top:50%;transform:translateY(-50%);font-weight:1000;color:#d94c63;font-size:13px}

.social{padding:7px 12px 9px;background:#fff;flex:0 0 auto;min-height:139px}.actionRow{height:26px;display:flex;align-items:center;gap:14px}.socialBtn{position:relative;width:22px;height:22px;border:0;background:transparent;padding:0;color:#23252b;cursor:pointer;touch-action:manipulation}.socialBtn svg{width:100%;height:100%}.socialBtn.like.on{color:#e83f66}.socialBtn.like.on svg{fill:currentColor}.socialBtn.save{margin-left:auto}.socialBtn.save.on svg{fill:currentColor}.actionDelta{position:absolute;left:50%;top:-11px;transform:translate(-50%,0);font-size:8px;font-weight:1000;color:var(--accent);opacity:0;pointer-events:none;white-space:nowrap}.actionDelta.pop{animation:deltaPop .62s ease-out}@keyframes deltaPop{0%{opacity:0;transform:translate(-50%,5px) scale(.8)}25%{opacity:1;transform:translate(-50%,-3px) scale(1)}100%{opacity:0;transform:translate(-50%,-14px) scale(.96)}}
.likeLine{min-height:21px;display:flex;align-items:center;gap:7px;font-size:9.4px;font-weight:850;color:#2d2f34}.likerFaces{display:none;align-items:center;padding-left:2px}.miniFace{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;border:2px solid white;margin-left:-5px;background:#ececef;color:#60636b;font-size:7px;font-weight:1000}.miniFace:first-child{margin-left:0}.likeCount{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.caption{font-size:9.5px;line-height:1.35;color:#393b41;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.caption b{margin-right:4px}.commentPreview{height:36px;overflow:hidden;margin-top:4px;position:relative}.commentLine{height:18px;display:flex;align-items:center;gap:5px;font-size:8.8px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#33353a}.commentLine b{font-weight:950}.commentLine span{overflow:hidden;text-overflow:ellipsis}.commentLine .cLike{margin-left:auto;font-size:7.5px;color:#9a9da4;flex:0 0 auto}.typingLine{height:17px;font-size:8px;color:#8b8e95;display:flex;align-items:center;gap:5px;opacity:0;transition:.16s}.typingLine.show{opacity:1}.typingDots{display:inline-flex;gap:2px}.typingDots i{width:3px;height:3px;border-radius:50%;background:#9a9da4;animation:typing 1s infinite alternate}.typingDots i:nth-child(2){animation-delay:.15s}.typingDots i:nth-child(3){animation-delay:.3s}@keyframes typing{to{opacity:.25;transform:translateY(-1px)}}.commentMore{height:16px;border:0;background:transparent;padding:0;color:#8c8f96;font-size:8.5px;font-weight:750;cursor:pointer}.time{font-size:7.5px;color:#a2a5ab;margin-top:1px}

/* social state evolves, but not every level simply gets louder */
#app[data-level="0"]{--accent:#777a82;--accent2:#a5a7ad;filter:none}#app[data-level="0"] .pollTop,#app[data-level="0"] .stimulus,#app[data-level="0"] .question,#app[data-level="0"] .questionSub,#app[data-level="0"] .choices{filter:saturate(.08)}#app[data-level="0"] .mathFigure:not(.colorCritical){filter:saturate(.08)}#app[data-level="0"] .avatar{filter:grayscale(1)}#app[data-level="0"] .brand span{color:#777a82}
#app[data-level="1"]{--accent:#6a7e98;--accent2:#9199a5}
#app[data-level="2"]{--accent:#517db7;--accent2:#7e8fbb}#app[data-level="2"] .poll{box-shadow:0 5px 16px #527db711}
#app[data-level="3"]{--accent:#6b79a9;--accent2:#8e78a9}
#app[data-level="4"]{--accent:#657da6;--accent2:#8d789c}
#app[data-level="5"]{--accent:#5f83aa;--accent2:#6f9d91}#app[data-level="5"] .avatarRing{border-color:color-mix(in srgb,var(--accent) 38%,transparent)}
#app[data-level="6"]{--accent:#5f83aa;--accent2:#6f9d91}
#app[data-level="7"]{--accent:#597ca7;--accent2:#886fa4}#app[data-level="7"] .commentPreview{background:linear-gradient(180deg,#fff0,#fff)}
#app[data-level="8"]{--accent:#487ebd;--accent2:#7565bc}#app[data-level="8"] .poll{box-shadow:0 7px 22px #487ebd18}
#app[data-level="9"]{--accent:#d94d78;--accent2:#7a66c7}#app[data-level="9"] .socialBtn.like{filter:drop-shadow(0 2px 5px #d94d7822)}
#app[data-level="10"]{--accent:#6f63c8;--accent2:#d75f8d}
#app[data-level="11"]{--accent:#d1537f;--accent2:#6f69c9}#app[data-level="11"] .likerFaces,#app[data-level="12"] .likerFaces,#app[data-level="13"] .likerFaces,#app[data-level="14"] .likerFaces,#app[data-level="15"] .likerFaces,#app[data-level="16"] .likerFaces,#app[data-level="17"] .likerFaces,#app[data-level="18"] .likerFaces,#app[data-level="19"] .likerFaces,#app[data-level="20"] .likerFaces{display:flex}
#app[data-level="12"]{--accent:#e25362;--accent2:#f1964a}#app[data-level="12"] .top{border-bottom-color:#ead2d5}
#app[data-level="13"]{--accent:#6b63d8;--accent2:#dc4f8c}#app[data-level="13"] .commentPreview{height:40px}
#app[data-level="14"]{--accent:#3f8ed7;--accent2:#d85593}
#app[data-level="15"]{--accent:#e34572;--accent2:#7558d6}#app[data-level="15"] .top{box-shadow:0 5px 22px #e3457215}
#app[data-level="16"]{--accent:#6b55db;--accent2:#31a8d7}#app[data-level="16"] .poll{box-shadow:0 0 0 1px #6b55db14,0 9px 28px #6b55db1d}
#app[data-level="17"]{--accent:#e0476c;--accent2:#7b55d9}#app[data-level="17"] .brand span{background:linear-gradient(90deg,#e0476c,#7b55d9);-webkit-background-clip:text;color:transparent}
#app[data-level="18"]{--accent:#ef3f72;--accent2:#42a6df}#app[data-level="18"] .top,#app[data-level="18"] .bottom{background:rgba(255,255,255,.92)}
#app[data-level="19"]{--accent:#ff3b6c;--accent2:#6d52de}#app[data-level="19"] .poll{box-shadow:0 0 0 1px #ff3b6c20,0 12px 34px #6d52de25}#app[data-level="19"] .verified{display:grid}

@keyframes topFlow{to{background-position:200% 0}}@keyframes ringPulse{to{transform:scale(1.12);opacity:.55}}

/* bottom nav */
.bottom{position:absolute;z-index:55;left:0;right:0;bottom:0;height:var(--nav);padding-bottom:var(--safe-b);background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start}.navItem{position:relative;height:60px;min-width:56px;border:0;background:transparent;color:#858991;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:7.5px;font-weight:850}.navItem.active{color:#272a30}.navItem svg{width:21px;height:21px}.navItem .nBadge{position:absolute;top:5px;right:7px;min-width:14px;height:14px;padding:0 3px;border-radius:999px;background:#e94462;color:white;font-size:7px;font-weight:1000;display:none;place-items:center;border:2px solid white}.navItem .nBadge.on{display:grid}

/* panels */
.panel{position:absolute;z-index:20;left:0;right:0;top:var(--top);bottom:var(--nav);overflow:auto;background:var(--bg);padding:14px 12px 26px}.panelTitle{font-size:21px;font-weight:1000;letter-spacing:-.04em}.panelLead{font-size:9.5px;color:#7f828a;line-height:1.5;margin-top:4px}.section{margin-top:15px}.sectionTitle{font-size:10px;font-weight:950;color:#555961;margin-bottom:7px}.cards{display:grid;gap:8px}.card{border:1px solid #e7e8ea;background:#fff;border-radius:15px;padding:11px}.discoverGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.subjectCard{border:1px solid #e4e5e7;background:#fff;border-radius:14px;padding:11px 6px;text-align:center}.subjectCard .sIcon{width:35px;height:35px;border-radius:50%;margin:auto;display:grid;place-items:center;background:var(--subjectSoft);color:var(--subjectInk);font-weight:1000}.subjectCard b{display:block;font-size:9.5px;margin-top:6px}.subjectCard small{font-size:7px;color:#8d9097}.trendCard{display:flex;align-items:center;gap:10px}.rank{width:24px;font-size:17px;font-weight:1000;color:#a0a3a9}.trendText{min-width:0}.trendText b{font-size:10px}.trendText div{font-size:8px;color:#8b8e95;margin-top:2px}.notice{display:flex;gap:9px;align-items:center}.noticeAvatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#f4f5f7,#e9ebef);font-size:9px;font-weight:1000;color:#666a72;flex:0 0 auto}.noticeBody{min-width:0;flex:1;font-size:9px;line-height:1.45;color:#3a3d43}.noticeMain{white-space:normal}.noticeBody b{font-weight:950}.noticeTime{font-size:7px;color:#a1a4aa;margin-top:3px}.noticeTag{flex:0 0 auto;padding:5px 8px;border-radius:999px;background:#f4f5f7;border:1px solid #e4e5e8;font-size:7px;font-weight:950;color:#666b74}.savedRow{display:flex;gap:9px}.savedThumb{width:54px;height:54px;border-radius:11px;background:#f0f1f2;display:grid;place-items:center;font-size:18px;font-weight:1000;color:#72757d;flex:0 0 auto}.savedInfo b{font-size:10px}.savedInfo p{font-size:8px;color:#777b84;margin:4px 0 0;line-height:1.4}.profileHero{background:#fff;border:1px solid #e6e7e9;border-radius:16px;padding:14px}.profileTop{display:flex;align-items:center;gap:11px}.profilePic{width:50px;height:50px;border-radius:50%;background:#f0f1f2;display:grid;place-items:center;font-size:19px;font-weight:1000}.profileName b{font-size:13px}.profileName div{font-size:8px;color:#8b8e95;margin-top:2px}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:13px;border-top:1px solid #eee;padding-top:11px}.stat{text-align:center}.stat b{display:block;font-size:16px}.stat span{font-size:7px;color:#858991}.heatMap{margin-top:12px;display:grid;gap:6px}.heatRow{display:grid;grid-template-columns:58px 1fr 34px;align-items:center;gap:7px;font-size:8px;font-weight:850}.track{height:6px;border-radius:999px;background:#eceef0;overflow:hidden}.fill{height:100%;background:#858891;border-radius:999px}.dopaGuide{display:grid;gap:6px}.dopaRow{background:#fff;border:1px solid #e7e8ea;border-radius:12px;padding:9px;display:grid;grid-template-columns:32px 1fr;gap:8px}.dopaNum{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#f1f2f3;font-size:10px;font-weight:1000}.dopaRow b{font-size:9px}.dopaRow p{font-size:7.5px;color:#858991;margin:2px 0 0;line-height:1.35}

/* comment sheet */
.sheetShade{position:absolute;z-index:150;inset:0;background:#0005;opacity:0;pointer-events:none;transition:.2s}.sheetShade.open{opacity:1;pointer-events:auto}.commentSheet{position:absolute;z-index:160;left:0;right:0;bottom:0;height:min(72%,610px);background:#fff;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:var(--safe-b)}.commentSheet.open{transform:none}.sheetHandle{width:42px;height:4px;border-radius:999px;background:#d7d8dc;margin:8px auto 6px}.sheetHead{height:40px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:950;position:relative}.sheetClose{position:absolute;right:10px;width:30px;height:30px;border:0;background:transparent;font-size:18px;color:#666}.sheetList{overflow:auto;padding:5px 12px 18px;flex:1}.sheetComment{display:flex;gap:8px;padding:9px 0}.sheetAvatar{width:30px;height:30px;border-radius:50%;background:#eff0f2;display:grid;place-items:center;font-size:7px;font-weight:1000;color:#656971;flex:0 0 auto}.sheetCBody{min-width:0;flex:1;font-size:9px;line-height:1.4}.sheetCBody b{font-weight:950;margin-right:5px}.sheetMeta{font-size:7px;color:#999ca3;margin-top:3px}.sheetHeart{width:28px;border:0;background:transparent;color:#999;font-size:12px}.reply{margin:7px 0 0 14px;padding-left:9px;border-left:1px solid #e8e9eb;color:#555;font-size:8.5px}

/* screen-level social overlays */

が明確になるように書き直したのは？","choices":["私たちの班が一週間調べると、校内にはごみが多かった。だから、全員がもっと気を付けるべきだと考える。","私たちの班が一週間調べると、昼休み後の廊下に紙ごみが特に多かった。この結果から、昼休み後の回収方法を工夫すべきだと考える。","私たちの班が一週間調べると、昼休み後の廊下に紙ごみが多かった。私は紙ごみが嫌いなので、減らすべきだと考える。","私たちの班が一週間調べると、昼休み後にごみが多かった。これからは、いろいろな対策を考える必要がある。"],"correct":1,"why":"正答は、具体的な調査結果「昼休み後の廊下に紙ごみが特に多い」を根拠にし、その結果に対応する「回収方法を工夫する」という提案へ論理的につないでいる。"},{"subject":"国語","grade":"中1","unit":"古文","passage":"今は昔、竹取の翁といふ者ありけり。","q":"「いふ」を現代仮名遣いにすると？","choices":["いふ","いう","いおう","ゆう"],"correct":1,"why":"歴史的仮名遣いの「いふ」は、現代仮名遣いでは「いう」。"},{"subject":"国語","grade":"中1","unit":"漢文","passage":"不レ知","q":"「不レ知」はどう読む？","choices":["知らず","知るにあらず","知りて","知らしむ"],"correct":0,"why":"レ点があるので「知」から「不」に返って読み、「知らず」と訓読する。"},{"subject":"国語","grade":"中2","unit":"漢字・語彙","passage":"長年研究してきた成果を、一冊の本におさめた。","q":"「おさめた」に当てる漢字はどれ？","choices":["治めた","納めた","収めた","修めた"],"correct":2,"why":"物を中に入れる、記録するという意味では「収める」。「税を納める」「国を治める」「学問を修める」と使い分ける。"},{"subject":"国語","grade":"中2","unit":"動詞の活用","passage":"急げば、まだ間に合う。","q":"「急げ」の活用形は？","choices":["未然形","連用形","仮定形","命令形"],"correct":2,"why":"「急ぐ」は五段活用。「急げば」の「急げ」は、助詞「ば」に続く仮定形。"},{"subject":"国語","grade":"中2","unit":"助詞","passage":"私は駅まで歩いた。","q":"移動の到達点を示す「まで」はどれ？","choices":["雨がやむまで待つ。","彼まで笑い出した。","東京まで電車で行く。","できるところまでやる。"],"correct":2,"why":"問題文の「まで」は移動の到達点を示す。Cの「東京まで」も場所の到達点を示している。"},{"subject":"国語","grade":"中2","unit":"説明的文章","passage":"同じ道具でも、文化が違えば使い方は変わる。例えば、食事のときに箸を使う文化もあれば、ナイフとフォークを中心に使う文化もある。道具の形だけを見て、その文化を理解したつもりになることはできない。","q":"二文目が果たしている役割は？","choices":["筆者の主張に反対する意見を示している","一文目の内容を具体例によって説明している","一文目とは関係のない新しい話題を出している","三文目の結論を否定している"],"correct":1,"why":"一文目の抽象的な内容を、箸とナイフ・フォークの例で具体化している。"},{"subject":"国語","grade":"中2","unit":"情報・メディア","passage":"SNSに「この勉強法を使ったら、うちのクラスの全員がテストで20点以上上がった。だから誰でも必ず成績が上がる。」という投稿があった。","q":"この主張を確かめるには、どの情報が必要？","choices":["投稿者が、普段どの教科を得意としているのかという情報","その投稿に、何件の「いいね」や共有が付いているのかという情報","何人を対象に、どの期間・方法で点数の変化を調べたのかという情報","投稿に使われている写真が、いつどこで撮影されたのかという情報"],"correct":2,"why":"「誰でも必ず成績が上がる」という一般化を確かめるには、対象人数、対象の選び方、期間、比較方法など、主張の根拠となる調査条件を確認する必要がある。"},{"subject":"国語","grade":"中2","unit":"論説文","passage":"学校の図書館には、紙の本だけでなく電子書籍も必要だと思う。文字の大きさを変えられたり、検索ができたりするため、読む人によっては紙の本より利用しやすいからだ。ただし、すべてを電子書籍に置き換える必要はない。","q":"筆者が伝えたい考えは？","choices":["電子書籍の利点だけを挙げ、紙の本は不要だとしている","電子書籍の利点を認めつつ、紙の本と目的に応じて併用する立場を示している","紙の本と電子書籍の特徴を紹介するだけで、筆者の立場は示していない","電子書籍の利用しやすさより、図書館の冊数を増やすことを主張している"],"correct":1,"why":"「電子書籍も必要」と利点を認めながら、「すべてを電子書籍に置き換える必要はない」としているため、両者を目的に応じて併用する立場と読める。"},{"subject":"国語","grade":"中2","unit":"文学的文章","passage":"「別に来なくてもよかったのに」と健太は言った。けれど、転校した友人が教室に入ってくると、健太はすぐに立ち上がり、ずっと空けておいた隣の席を指さした。","q":"健太について、本文から読み取れるのはどれ？","choices":["友人が来たことを歓迎していない気持ちが、行動にも表れている","歓迎する気持ちはあるが、それを言葉では素直に表していない","友人が来ることを知らず、席を偶然空けていた","自分は席を離れ、友人だけを教室に残そうとしている"],"correct":1,"why":"「来なくてもよかった」という言葉と、「すぐ立つ」「隣の席を空けておく」という行動が食い違う。この対比から、歓迎する気持ちを素直に言えない様子が読み取れる。"},{"subject":"国語","grade":"中2","unit":"詩・表現","passage":"夕焼けが\n町の屋根を\nゆっくり飲みこんでいく","q":"「夕焼けが町の屋根を飲みこむ」という表現によって、どのような印象が生まれている？","choices":["「飲みこむ」という動きで、夕焼けがゆっくり町を包む様子を印象づけている","夕焼けの色を数値で示し、町の明るさを正確に説明している","町の屋根を夕焼けにたとえ、屋根と空の形が似ていることを示している","同じ言葉を繰り返し、音の響きだけを強く印象づけている"],"correct":0,"why":"「飲みこむ」という動きを夕焼けに与えることで、夕焼けの色がゆっくり町を覆っていく様子を生き生きと感じさせている。"},{"subject":"国語","grade":"中2","unit":"古文","passage":"ある人、弓射ることを習ふに、二つの矢を手に持ちて的に向かふ。","q":"この人物について、本文から確実に言えることは？","choices":["二本の矢を同時に放とうとして、すでに弓を引いて的を狙っている。","弓を習うとき、二本の矢を手に持ち、的に向かっている。","二つの的を順番に射るため、一本ずつ使う矢を用意して待っている。","弓の稽古を終えたので、二本の矢を手に持って帰ろうとしている。"],"correct":1,"why":"本文から確実に分かるのは、弓を習う人物が二本の矢を手に持ち、的に向かっていること。二本を同時に射ることや的が二つあること、稽古を終えたことは書かれていない。「的に向かふ」だけで、的へ歩いているとは判断できない。"},{"subject":"国語","grade":"中2","unit":"漢文","passage":"未","q":"再読文字「未」はどう読む？","choices":["いまだ〜ず","まさに〜べし","すべからく〜べし","あへて〜ず"],"correct":0,"why":"再読文字「未」は「いまだ〜ず」と二度読む。まだその状態になっていないことを表す。"},{"subject":"国語","grade":"中3","unit":"語彙・慣用表現","passage":"その研究は、これまで当然だと思われていた考え方に一石を投じた。","q":"「一石を投じた」は、ここではどのような意味？","choices":["議論になっていた問題に決着をつけ、論争を終わらせた。","それまでの考えに問いを投げかけ、新しい議論のきっかけを作った。","自分の考えを強く主張したため、多くの人から批判を受けた。","従来の考え方を改めず、そのまま受け継ぐ立場を明らかにした。"],"correct":1,"why":"「一石を投じる」は、静かな水面に石を投げるように、問題を提起して反響や議論を起こすきっかけを作ること。解決や批判そのものを意味しない。"},{"subject":"国語","grade":"中3","unit":"敬語","passage":"先生に、昨日の資料を見たか尋ねる。","q":"自然で適切な言い方はどれ？","choices":["先生、昨日の資料を見た？","先生、昨日の資料をご覧になりましたか。","先生、昨日の資料を拝見しましたか。","先生、昨日の資料を見させましたか。"],"correct":1,"why":"先生の「見る」という動作を高めるので尊敬語「ご覧になる」を使う。「拝見する」は自分の動作をへりくだる謙譲語。"},{"subject":"国語","grade":"中3","unit":"助動詞","passage":"① 私は先生にほめられた。\n② この窓から海が見られる。","q":"①②の「られる」の意味の組み合わせは？","choices":["①可能　②受け身","①受け身　②可能","①尊敬　②自発","①自発　②尊敬"],"correct":1,"why":"①は「先生が私をほめた」ので受け身。②は「見ることができる」ので可能。"},{"subject":"国語","grade":"中3","unit":"推敲","passage":"地域の図書館はもっと利用されるべきだ。便利だからである。","q":"主張と根拠がより明確になるように直したものは？","choices":["地域の図書館は便利な場所である。利用する人がもっと増えるよう、みんなで方法を考えるべきだ。","地域の図書館には学習スペースや資料検索などの機能がある。だから、地域の学習拠点としてもっと活用されるべきだ。","地域の図書館には多くの本がある。私は読書が好きなので、地域のみんなももっと利用するべきだと思う。","地域の図書館にはさまざまな利点がある。人によって感じ方は違うが、もっと利用されるべきだと思う。"],"correct":1,"why":"正答は「学習スペースや資料検索」という具体的な機能を根拠にし、その根拠と対応する「学習拠点として活用すべき」という主張を示している。"},{"subject":"国語","grade":"中3","unit":"論説文","passage":"学校でタブレットを使う機会は増えている。画面を見る時間が長くなることを心配する意見もある。しかし、紙とデジタルを目的に応じて使い分ければ、資料の比較や共同編集など、紙だけでは難しい学びも可能になる。","q":"筆者は、どのように論を進めている？","choices":["反対意見を先に示し、その内容をそのまま結論として採用している","懸念を示したうえで、「しかし」を用いて条件付きの自分の考えを提示している","タブレットの利点と欠点を並べ、どちらを重視するかは示していない","具体例を挙げたあと、その具体例とは関係のない主張へ移っている"],"correct":1,"why":"筆者は「画面を見る時間」への懸念を紹介したあと、「しかし」で転換し、紙とデジタルを使い分けるという自分の立場を示している。"},{"subject":"国語","grade":"中3","unit":"情報・メディア","passage":"学校A：「読書が好き」80％（回答20人）\n学校B：「読書が好き」65％（回答400人）","q":"この結果を解釈するとき、注意すべき点はどれ？","choices":["学校Aの割合が高いので、調査条件にかかわらず学校Aの方が読書好きだと結論づける","回答人数の多い学校Bの方が、割合の大小にかかわらず読書好きだと結論づける","割合を比べるだけでなく、回答人数や対象者の選び方など調査条件も確かめる","20人と400人では人数が違うので、二つの割合は比較する意味がないと考える"],"correct":2,"why":"割合は重要な情報だが、標本の人数や選び方が違えば結果の確かさや代表性も変わり得る。数値だけで即断せず、調査条件を確認する必要がある。"},{"subject":"国語","grade":"中3","unit":"文学的文章","passage":"母は玄関で「気を付けてね」と言った。私は振り返らずに手だけを上げた。昼休みになって、朝、弁当を受け取らずに家を出たことを思い出した。鞄を探すと、一番下に弁当の包みがあり、「忘れ物」と母の字で書かれた紙が添えられていた。","q":"最後の「忘れ物」から、母のどのような思いが読み取れる？","choices":["母は弁当を入れたことを主人公に強く知らせたかった","母は主人公が弁当を忘れることに腹を立てていた","母は主人公を気に掛け、言葉で押しつけずに弁当を入れておいた","主人公は出発前に、母へ弁当を入れるよう頼んでいた"],"correct":2,"why":"主人公は朝、弁当を受け取らずに出たが、鞄には母が弁当を入れていた。「忘れ物」とだけ添えた行動から、言葉で押しつけずに主人公を気遣う母の思いが読み取れる。"},{"subject":"国語","grade":"中3","unit":"短歌・表現","passage":"改札を\n出れば夕立\nやんでいて\n傘だけ濡れて\n夏の駅前","q":"「傘だけ濡れて」という表現は、どのような情景を印象づける？","choices":["濡れた傘を示すことで、夕立の雨量がどれほど多かったかを客観的に記録している。","雨はもう止んでいるのに濡れた傘だけが残り、通り過ぎた夕立の気配と余韻を残している。","傘を人のように描くことで、夏の暑さに対する話者のいら立ちを直接表現している。","濡れた傘を描くことで、夕立が今も降り続いている駅前の様子を強く印象づけている。"],"correct":1,"why":"「やんでいて」と「傘だけ濡れて」の対照により、雨そのものではなく、通り過ぎた夕立の痕跡が残る情景をつくり、余韻を生んでいる。"},{"subject":"国語","grade":"中3","unit":"古文","passage":"月日は百代の過客にして、行きかふ年もまた旅人なり。","q":"「月日」や「年」を「旅人」にたとえることで、どのような考えが表されている？","choices":["長い旅を続けるには、十分な時間を確保する必要があるという考え。","月日や年は旅人のようにとどまらず、絶えず移り過ぎていくという考え。","旅を重ねる人ほど、ほかの人より早く年を取っていくという考え。","昔の旅は危険が多く、年月をかけなければ目的地へ着けないという考え。"],"correct":1,"why":"「月日」「年」を、行き来し続ける「旅人」にたとえることで、時間が一か所にとどまらず絶えず過ぎていくという見方を表している。"},{"subject":"国語","grade":"中3","unit":"漢文","passage":"温故而知新、可以為師矣。","q":"「温故而知新」が表す考えは？","choices":["過去の知識をそのまま暗記し直すことが、学びの中心だという考え","新しい知識を得るには、過去の学びを捨てるべきだという考え","以前学んだことを振り返り、そこから新しい理解を得ることが大切だという考え","教師になるには、古い知識だけを多く覚える必要があるという考え"],"correct":2,"why":"「温故知新」は、以前学んだことをたずね直し、そこから新しい知識や理解を得るという意味。単なる暗記ではなく、既習事項を新しい理解につなげる姿勢を表す。"}];

const MATH_CURRICULUM=[{"subject":"数学","grade":"中1","unit":"正の数・負の数","passage":"","q":"−7 + 12 − 9 の答えは？","choices":["−16","−4","4","14"],"correct":1,"why":"−7＋12＝5、5−9＝−4。正負の数は、符号と数の大きさを分けて考えると整理しやすい。"},{"subject":"数学","grade":"中1","unit":"正の数・負の数","passage":"","q":"−(3²) + 4 × (−2) の答えは？","choices":["−17","−1","1","17"],"correct":0,"why":"累乗を先に計算すると−(3²)＝−9。さらに4×(−2)＝−8なので、−9＋(−8)＝−17。かっこの位置と符号を丁寧に確認する。"},{"subject":"数学","grade":"中1","unit":"文字と式","passage":"1本120円のペンをx本と、80円の消しゴムを1個買う。","q":"代金の合計を表す式は？","choices":["120＋80x","120x＋80","200x","120(x＋80)"],"correct":1,"why":"ペン代は120x円。そこに消しゴム80円を加えるので、120x＋80。"},{"subject":"数学","grade":"中1","unit":"データの分布","passage":"40点以上50点未満：3人\n50点以上60点未満：5人\n60点以上70点未満：8人\n70点以上80点未満：6人","q":"度数が最大の階級は？","choices":["40点以上50点未満","50点以上60点未満","60点以上70点未満","70点以上80点未満"],"correct":2,"why":"度数が最も大きいのは8人の「60点以上70点未満」。階級ごとの人数を比較する。"},{"subject":"数学","grade":"中1","unit":"方程式","passage":"ある数の3倍に4を足すと25になった。ある数をxとする。","q":"この数量関係を表す方程式は？","choices":["3x＋4＝25","3(x＋4)＝25","x＋3＋4＝25","4x＋3＝25"],"correct":0,"why":"「ある数の3倍」は3x。そこに4を足すので、3x＋4＝25。"},{"subject":"数学","grade":"中1","unit":"比例","passage":"yはxに比例し、x＝4のときy＝12である。","q":"yをxの式で表すと？","choices":["y＝3x","y＝4x","y＝12x","y＝x＋8"],"correct":0,"why":"比例はy＝ax。12＝4aよりa＝3なので、y＝3x。"},{"subject":"数学","grade":"中1","unit":"反比例","passage":"","q":"次のうち、yがxに反比例するものは？","choices":["y＝5x","y＝x＋5","y＝5/x","y＝x²"],"correct":2,"why":"反比例はy＝a/xの形で表される。したがってy＝5/x。"},{"subject":"数学","grade":"中1","unit":"平面図形・作図","passage":"線分ABの垂直二等分線を作図する。","q":"垂直二等分線の作図手順として正しいのは？","choices":["AとBを中心に、互いに異なる半径の円弧を描き、その交点をAと結ぶ。","AとBを中心に、ABの半分より大きい同じ半径の円弧を描き、二つの交点を結ぶ。","Aを中心にABと同じ半径の円を描き、円とABが交わる点をBと結ぶ。","AとBからABに垂直な直線をそれぞれ引き、その二本の中間を目測で取る。"],"correct":1,"why":"A・Bから等距離にある点を二つ作るため、AとBを中心に同じ半径の円弧を描く。二つの交点はいずれもAとBから等距離なので、それらを結ぶ直線が垂直二等分線になる。"},{"subject":"数学","grade":"中1","unit":"空間図形","passage":"半径3cm、高さ5cmの円柱がある。","q":"この円柱の体積は？","choices":["15π cm³","30π cm³","45π cm³","90π cm³"],"correct":2,"why":"円柱の体積＝底面積×高さ。π×3²×5＝45π cm³。"},{"subject":"数学","grade":"中1","unit":"データ・確率","passage":"あるコインを200回投げたところ、表が118回出た。","q":"今回の実験結果について正しく言えるのは？","choices":["次の1回は、表より裏の方が出やすいと判断できる","このコインの表の確率は、実験回数を増やしても0.59のままだと断定できる","今回200回の試行では、表の相対度数が0.59だった","別の200回の試行でも、表は118回出ると予測できる"],"correct":2,"why":"118÷200＝0.59は「今回の試行」での相対度数。多数回の結果から確率を推測する手掛かりにはなるが、次の1回や別の実験結果を確定する値ではない。"},{"subject":"数学","grade":"中2","unit":"式の計算","passage":"","q":"2(3x − 1) − (x + 4) を簡単にすると？","choices":["5x−2","5x−6","7x−5","7x−6"],"correct":1,"why":"6x−2−x−4＝5x−6。かっこの前のマイナスで符号が変わることに注意。"},{"subject":"数学","grade":"中2","unit":"文字式の利用","passage":"連続する二つの整数をn、n＋1とする。","q":"この二つの整数の和について正しい説明は？","choices":["和は2nなので、nに関係なく偶数になる","和は2n＋1なので、nに関係なく奇数になる","和はn(n＋1)なので、nが偶数のときだけ奇数になる","和は2n＋2なので、nに関係なく偶数になる"],"correct":1,"why":"n＋(n＋1)＝2n＋1。2nは整数nに対して必ず偶数なので、2n＋1は必ず奇数になる。"},{"subject":"数学","grade":"中2","unit":"連立方程式","passage":"120円のペンと80円の消しゴムを合わせて10個買い、代金は1040円だった。","q":"ペンは何本買った？","choices":["4本","5本","6本","8本"],"correct":2,"why":"ペンをx本、消しゴムをy個とすると、x＋y＝10、120x＋80y＝1040。解くとx＝6。"},{"subject":"数学","grade":"中2","unit":"一次関数","passage":"一次関数のグラフが点(0, 3)と点(2, 7)を通る。","q":"この一次関数の式は？","choices":["y＝2x＋3","y＝3x＋2","y＝2x＋7","y＝4x−1"],"correct":0,"why":"変化の割合は(7−3)÷(2−0)＝2。x＝0のときy＝3なので、y＝2x＋3。"},{"subject":"数学","grade":"中2","unit":"一次関数","passage":"二つの直線 y＝2x＋1 と y＝−x＋7 がある。","q":"二つの直線の交点は？","choices":["(1, 3)","(2, 5)","(3, 4)","(4, 3)"],"correct":1,"why":"交点ではyが等しい。2x＋1＝−x＋7よりx＝2、y＝5。"},{"subject":"数学","grade":"中2","unit":"平行線と角","passage":"平行な2直線ℓ、mを1本の直線が横切っている。ℓとの交点で内側にできる角の一つが68°である。","q":"mとの交点で、この68°の角と錯角の関係にある角は何度？","choices":["22°","68°","112°","136°"],"correct":1,"why":"平行な2直線を1本の直線が横切るとき、錯角は等しい。したがって68°。"},{"subject":"数学","grade":"中2","unit":"合同と証明","passage":"△ABCと△DEFで、AB＝DE、BC＝EF、∠B＝∠Eである。","q":"二つの三角形が合同といえる合同条件は？","choices":["3組の辺がそれぞれ等しい","2組の辺とその間の角がそれぞれ等しい","1組の辺とその両端の角がそれぞれ等しい","3組の角がそれぞれ等しい"],"correct":1,"why":"等しい2辺AB・BCの間にある角が∠Bなので、「2組の辺とその間の角」がそれぞれ等しい。"},{"subject":"数学","grade":"中2","unit":"三角形と四角形","passage":"四角形ABCDがある。","q":"これだけで平行四辺形であるといえる条件は？","choices":["一組の対辺が平行で、もう一組の対辺の長さが等しい。","二本の対角線の長さが等しく、互いに交わっている。","一組の対辺が平行で、その一組の対辺の長さも等しい。","一組の隣り合う辺が等しく、その間の角が直角である。"],"correct":2,"why":"「一組の対辺が平行で、その一組の対辺の長さも等しい」は平行四辺形になるための条件の一つ。他の条件だけでは、一般の台形や別の四角形も含まれ得る。"},{"subject":"数学","grade":"中2","unit":"確率","passage":"大小2個のさいころを同時に投げる。","q":"出た目の和が8になる確率は？","choices":["4/36","5/36","6/36","8/36"],"correct":1,"why":"(2,6)、(3,5)、(4,4)、(5,3)、(6,2)の5通り。全36通りなので5/36。"},{"subject":"数学","grade":"中2","unit":"箱ひげ図・四分位数","passage":"クラスA：第1四分位数52点、中央値66点、第3四分位数76点\nクラスB：第1四分位数58点、中央値65点、第3四分位数72点","q":"中央50％のデータの散らばりが大きいのは？","choices":["クラスA","クラスB","同じ","この情報では分からない"],"correct":0,"why":"四分位範囲は第3四分位数−第1四分位数。Aは24点、Bは14点なのでAの方が大きい。"},{"subject":"数学","grade":"中3","unit":"平方根","passage":"","q":"√75 を簡単にすると？","choices":["3√5","5√3","15√3","25√3"],"correct":1,"why":"75＝25×3なので、√75＝√(25×3)＝5√3。"},{"subject":"数学","grade":"中3","unit":"展開と因数分解","passage":"","q":"x²−7x＋12 を因数分解すると？","choices":["(x−2)(x−6)","(x−3)(x−4)","(x＋3)(x＋4)","(x−1)(x−12)"],"correct":1,"why":"積が12、和が−7になる2数は−3と−4。したがって(x−3)(x−4)。"},{"subject":"数学","grade":"中3","unit":"二次方程式","passage":"","q":"x²−5x＋6＝0 の解は？","choices":["x＝1, 6","x＝2, 3","x＝−2, −3","x＝−1, −6"],"correct":1,"why":"x²−5x＋6＝(x−2)(x−3)。よってx＝2, 3。"},{"subject":"数学","grade":"中3","unit":"関数 y＝ax²","passage":"yはx²に比例し、x＝2のときy＝12である。","q":"yをxの式で表すと？","choices":["y＝2x²","y＝3x²","y＝6x²","y＝12x²"],"correct":1,"why":"y＝ax²にx＝2、y＝12を代入すると12＝4a。a＝3なのでy＝3x²。"},{"subject":"数学","grade":"中3","unit":"関数 y＝ax²","passage":"関数 y＝2x² で、xが1から3まで増加する。","q":"このときの変化の割合は？","choices":["4","6","8","16"],"correct":2,"why":"x＝1でy＝2、x＝3でy＝18。(18−2)÷(3−1)＝8。"},{"subject":"数学","grade":"中3","unit":"相似","passage":"△ABCと△DEFは相似で、相似比 ABC：DEF＝2：3。AB＝8cmである。","q":"ABに対応するDEの長さは？","choices":["6cm","10cm","12cm","16cm"],"correct":2,"why":"8：DE＝2：3なので、DE＝8×3/2＝12cm。"},{"subject":"数学","grade":"中3","unit":"相似と面積","passage":"相似な二つの図形の相似比が2：3である。","q":"面積比は？","choices":["2：3","4：6","4：9","8：27"],"correct":2,"why":"面積比は相似比の2乗。2²：3²＝4：9。"},{"subject":"数学","grade":"中3","unit":"円周角","passage":"円Oで、弧ABに対する中心角∠AOBが100°である。","q":"同じ弧ABに対する円周角∠ACBは？","choices":["25°","50°","100°","200°"],"correct":1,"why":"同じ弧に対する円周角は中心角の半分。100°÷2＝50°。"},{"subject":"数学","grade":"中3","unit":"三平方の定理","passage":"直角三角形の直角をはさむ2辺の長さが6cm、8cmである。","q":"斜辺の長さは？","choices":["7cm","10cm","12cm","14cm"],"correct":1,"why":"6²＋8²＝x²。36＋64＝100なので、斜辺x＝10cm。"},{"subject":"数学","grade":"中3","unit":"標本調査","passage":"全校生徒800人の「1日の読書時間」を、標本調査で調べたい。","q":"全校生徒の傾向を調べるなら、どの方法が適切？","choices":["図書委員30人を選び、読書時間を詳しく聞く","各学年で読書が好きな生徒を同じ人数ずつ選ぶ","全校生徒から、特定の集団に偏らないよう無作為に100人を選ぶ","読書時間が長そうなクラスと短そうなクラスを1つずつ選ぶ"],"correct":2,"why":"母集団である全校生徒の傾向を推測するには、標本が特定の属性に偏らないように選ぶことが重要。無作為抽出はそのための基本的な方法。"}];

const SOCIAL_CURRICULUM=[{"subject":"社会","grade":"中1","unit":"世界の姿","passage":"地球上の位置は、緯度と経度を組み合わせて表す。","q":"緯度と経度の説明で正しいのは？","choices":["緯度は本初子午線から東西、経度は赤道から南北の位置を表す","緯度も経度も赤道を基準にして位置を表す","緯度は赤道から南北、経度は本初子午線から東西の位置を表す","緯度は北極からの距離、経度は南極からの距離を表す"],"correct":2,"why":"緯度は赤道を0°として南北を、経度は本初子午線を0°として東西を表す。二つを組み合わせると地球上の位置を示せる。"},{"subject":"社会","grade":"中1","unit":"世界の姿・時差","passage":"日本標準時の基準となる東経135°から、15°西の東経120°を標準時子午線とする地域を考える。標準時子午線の経度15°の差につき、標準時には1時間の時差が生じる。","q":"この地域の標準時は、日本標準時よりどうなる？","choices":["1時間進む","1時間遅れる","15時間遅れる","同じ時刻になる"],"correct":1,"why":"東経120°を標準時子午線とする地域と、東経135°を基準とする日本との経度差は15°。西側の地域の標準時は1時間遅れる。実際の標準時は各国・地域が定めるため、単に東経120°にある地点の時刻を経度だけから決めることはできない。"},{"subject":"社会","grade":"中1","unit":"生活と環境","passage":"ある地域では年間を通して降水量が少なく、昼と夜の気温差が大きい。人々は水を得られる場所を中心に生活してきた。","q":"この地域の環境に適応した生活として考えられるのは？","choices":["河川やオアシスの周辺に集落をつくり、得られる水を農業や生活に利用する","雨の多い季節が長く続くことを利用し、広い水田を各地に広げる","森林から得られる木材を中心に生活し、年間を通して焼畑を行う","永久凍土が解ける短い夏だけ農耕し、冬は狩猟を中心に生活する"],"correct":0,"why":"降水量が少ない地域では、水を確保できる河川沿いやオアシスに生活や農業が集まりやすい。本文の「水を得られる場所を中心に生活」が手掛かり。"},{"subject":"社会","grade":"中1","unit":"アジア州","passage":"東アジアや東南アジアには、稲作が盛んな地域が広く見られる。","q":"稲作が盛んな背景として考えられるのは？","choices":["冷涼で乾燥した気候が続き、灌漑をほとんど必要としないから","高温で雨の多い時期が重なり、水田の水を確保しやすい地域が多いから","冬の降雪量が多く、雪解け水だけで一年中水田を維持できるから","牧草地が広く、家畜の飼育に適した地域が多いから"],"correct":1,"why":"東・東南アジアのモンスーン地域には、高温期に降水が多く、河川や平野の水を利用しやすい場所が多い。こうした条件は水を多く使う稲作と結び付いている。"},{"subject":"社会","grade":"中1","unit":"オセアニア州","passage":"内陸部に乾燥地域や広大な草原があり、牧羊・牧牛が盛んな地域もある。人口が東南部などの沿岸部に偏っている国は（　　　）。","q":"（　　　）に入る国は？","choices":["オーストラリア","ニュージーランド","フィジー","パプアニューギニア"],"correct":0,"why":"これらはオーストラリアの特徴。内陸部には乾燥地域が広がり、人口は東南部などの沿岸部に集中している。"},{"subject":"社会","grade":"中1","unit":"古代文明","passage":"古代の大きな文明の多くは、大河川の流域で発達した。","q":"大河川の流域が文明の発達を支えた条件は？","choices":["河川が国どうしの争いを減らし、都市を外敵から守りやすくしたこと","農業用水を得やすく、肥沃な土地や水上交通も利用できたこと","洪水がほとんど起こらず、治水や水の管理を考える必要がなかったこと","海から遠いため他地域との交流が少なく、社会の仕組みが変化しなかったこと"],"correct":1,"why":"大河川は農業用水や肥沃な土壌をもたらし、人や物を運ぶ交通路にもなった。こうした条件が人口の集中や都市・国家の発達を支えた。"},{"subject":"社会","grade":"中1","unit":"弥生時代","passage":"日本では弥生時代に水田稲作が広がった。","q":"稲作の広がりは、社会をどのように変えた？","choices":["収穫物を長期保存する必要が減り、集落どうしの関係が弱まった","水田の管理や収穫物の蓄積を通して集団のまとまりが強まり、社会的な差も生まれた","食料生産より狩猟採集への依存が高まり、定住する人が減った","稲作の広がりと同時に、日本列島全体を統一する中央政府が成立した"],"correct":1,"why":"水田稲作には水管理や共同作業が必要で、収穫物を蓄えることもできる。その過程で集落のまとまりや首長層、貧富・身分の差が見られるようになった。"},{"subject":"社会","grade":"中1","unit":"律令国家","passage":"律令国家では、戸籍や計帳をもとに人々を登録し、その記録は口分田の給付や租税・兵役の対象を決める際にも使われた。","q":"この仕組みから、律令国家のどのような特徴が読み取れる？","choices":["地域ごとに異なる慣習へ任せ、中央政府は人や土地の把握に関与しなかった","寺院を通じて人々を登録し、宗教行事への参加だけを全国で統一した","人や土地を記録し、全国を共通の制度で支配・運営しようとした","港に出入りする商人だけを登録し、対外貿易から税を集めようとした"],"correct":2,"why":"戸籍・計帳は単なる名簿ではなく、土地の給付や租税・兵役など全国共通の制度を運営する基礎資料だった。そこから、中央政府が人や土地を把握して統治しようとしたことが分かる。"},{"subject":"社会","grade":"中1","unit":"鎌倉時代","passage":"鎌倉幕府では、将軍と御家人が「御恩と奉公」で結び付いた。","q":"「御恩と奉公」の関係を正しく説明しているのは？","choices":["将軍が御家人の所領支配を認め、御家人が軍役や警護で応える関係","朝廷が御家人に官位を与え、御家人が年貢を朝廷だけへ納める関係","御家人が将軍へ土地を与え、将軍がその土地を耕作する関係","寺社が御家人を任命し、将軍が寺社の軍事力に従う関係"],"correct":0,"why":"将軍からの所領の保障・新恩給与などが「御恩」、御家人が軍役や警護などで仕えることが「奉公」。双方向の主従関係として捉える。"},{"subject":"社会","grade":"中1","unit":"室町時代・東アジア","passage":"室町時代、日本と明との正式な貿易では「勘合」と呼ばれる札が用いられた。","q":"勘合を用いた主な理由は？","choices":["倭寇などと正式な貿易船を区別するため","日本国内の年貢を集めるため","キリスト教徒を見分けるため","モンゴル軍の侵攻を防ぐため"],"correct":0,"why":"日明貿易では勘合を用いて正式な貿易船と倭寇などを区別したため、勘合貿易とも呼ばれる。"},{"subject":"社会","grade":"中2","unit":"日本の地形","passage":"日本は山地や丘陵が国土の多くを占め、広い平野は限られている。","q":"人口や都市が平野部に集中しやすいのはなぜ？","choices":["平野では水害や地震の危険が小さいため、防災を考える必要が少ないから","住宅・道路・鉄道・工場などを配置できる連続した土地を確保しやすいから","山地では河川や道路を利用できず、人が生活できないから","平野では農業利用が少ないため、大部分を都市用地にしやすいから"],"correct":1,"why":"平野は比較的平坦で、住宅・交通・工業などに使うまとまった土地を確保しやすい。一方で水害や地震などの災害リスクもあり、「平野だから安全」というわけではない。"},{"subject":"社会","grade":"中2","unit":"日本の気候","passage":"冬、北西から吹く空気を観測すると、日本海へ出る前より、日本海を渡った後の方が水蒸気を多く含んでいた。その空気は日本列島の山地にぶつかって上昇する。","q":"日本海側に雪が多いしくみを説明しているのは？","choices":["海上で水蒸気を失った空気が山地を下り、気温が上がって雪雲をつくる","海上で水蒸気を得た空気が山地で上昇・冷却され、雪雲が発達する","太平洋から入った湿った空気が山地を越え、日本海側で上昇して雪になる","山地で乾燥した空気が日本海上へ戻り、海面付近だけで雪を降らせる"],"correct":1,"why":"日本海上で水蒸気を含んだ季節風が山地で上昇すると冷却され、雲が発達して雪を降らせやすくなる。観測された「海を渡った後に水蒸気が増える」ことを説明に使う必要がある。"},{"subject":"社会","grade":"中2","unit":"北海道地方・農業","passage":"北海道では、一戸当たりの耕地面積が比較的大きく、大型機械を使う農業も見られる。","q":"この特色が生まれた背景は？","choices":["平らで広い農地を確保しやすい地域があるから","一年中高温多雨だから","人口密度が日本で最も高いから","水田以外の農業が法律で禁止されているから"],"correct":0,"why":"北海道には広い土地を生かした大規模な畑作や酪農が見られ、大型機械を用いる農業にも適している。"},{"subject":"社会","grade":"中2","unit":"日本の工業","passage":"関東から北九州にかけて、太平洋・瀬戸内海沿岸には工業地域が連なっている。","q":"工業がこの地域に集まってきたのはなぜ？","choices":["国内の原料産地が沿岸に集まり、原料を短距離で工場へ運べる条件が最も大きかったから","港・大都市・交通網が集まり、輸入原料の受け入れ、製品輸送、市場への接近に有利だったから","沿岸部では農業や住宅地に使える土地が少なく、工場用地として優先的に残されていたから","海水を大量に使う工業が日本の工業の中心で、内陸には工場を建てにくかったから"],"correct":1,"why":"太平洋ベルトには大都市、港湾、鉄道・道路などが連なり、輸入原料の受け入れ、製品輸送、労働力、市場への近さなど複数の立地条件がそろった。"},{"subject":"社会","grade":"中2","unit":"人口・地域課題","passage":"地域Aでは10年間で人口が18％減り、65歳以上の割合が29％から38％へ上昇した。路線バスは1日12便から6便へ減り、商店も3店閉店した。","q":"資料から、この地域で優先度が高い課題は何だと考えられる？","choices":["生活に必要な移動や買い物を確保するため、交通や店舗の維持方法を見直す","人口減少への対応より、通勤時間帯の自動車渋滞を減らす道路整備を優先する","商店の閉店は人口変化と切り離して考え、商業サービスへの対策は行わない","高齢者の割合が上がっているが、若年層向け施設の大規模増設を最優先する"],"correct":0,"why":"人口減少・高齢化に加え、バス減便と商店閉店が同時に起きている。資料から直接読み取れる生活上の課題は、移動や買い物の手段をどう維持するかである。"},{"subject":"社会","grade":"中2","unit":"安土桃山時代","passage":"太閤検地では、田畑の広さや収穫量の目安、耕作者などが記録された。刀狩では、農民が持つ刀ややりなどの武器が集められた。","q":"太閤検地と刀狩は、社会にどのような変化をもたらした？","choices":["土地と年貢の基準を把握しやすくなり、農民と武士の役割の区別も進んだ","農民が武器を持って軍事力を高め、大名ごとの独立性が強くなった","都市の商工業者だけが土地を所有し、農村の年貢制度は廃止された","寺社が全国の土地と武器を管理し、中央の支配から独立するようになった"],"correct":0,"why":"検地は土地・耕作者・石高を把握する基礎となり、刀狩は農民から武器を回収した。両者を合わせて見ると、年貢徴収の基盤整備と兵農分離につながったと考えられる。"},{"subject":"社会","grade":"中2","unit":"江戸幕府","passage":"江戸幕府は大名に参勤交代を行わせ、大名の妻子を江戸に住まわせる仕組みも整えた。","q":"参勤交代を幕府が制度化した主な目的は？","choices":["大名を江戸と領地に交代で居住させ、幕府による大名統制を強めるため","大名が領地を離れる期間を設け、村々の自治を広げて年貢負担を軽くするため","各藩の兵力を江戸へ集め、幕府の指揮で海外遠征を行える軍をつくるため","大名どうしの往来や婚姻を自由にし、諸藩の政治的な結び付きを強めるため"],"correct":0,"why":"参勤交代は大名を江戸と領地に交代で居住させる大名統制策の一つ。大名行列や江戸滞在は交通・宿場の発達にも影響した。"},{"subject":"社会","grade":"中2","unit":"江戸時代・対外関係","passage":"江戸時代、幕府は外国との交流を厳しく制限したが、海外との関係が完全になくなったわけではない。","q":"江戸時代の対外関係を正しく説明しているのは？","choices":["オランダ・中国との貿易は長崎で続き、朝鮮・琉球・アイヌとの関係にもそれぞれ窓口があった","貿易は長崎に限られ、朝鮮・琉球・アイヌとの外交や交易は行われなかった","朝鮮との交流は対馬を通じて続いたが、中国やオランダとの貿易は停止していた","海外との窓口は長崎に集約され、各藩は対外関係にほとんど関わらなかった"],"correct":0,"why":"江戸幕府は交流を制限したが、長崎のオランダ・中国、対馬の朝鮮、薩摩を介した琉球、松前を介したアイヌなど複数の窓口があった。"},{"subject":"社会","grade":"中2","unit":"開国と幕末","passage":"19世紀半ば、欧米諸国が日本へ開国を求め、幕府は条約を結んで港を開いた。","q":"開国によって幕府の政治が大きく揺れたのはなぜ？","choices":["開港後の物価や貿易、条約への対応をめぐって幕府への不満や政治対立が強まったから","幕府が外国との通商をほぼ拒否したため、国内の経済活動が大きく停滞したから","開国によって諸藩が外交権を得て、それぞれ外国と条約を結び始めたから","開国後ただちに身分制度と藩が廃止され、幕府の役割がなくなったから"],"correct":0,"why":"開国後は条約の内容、貿易による経済変化、外国への対応をめぐって幕府への批判や政治対立が強まり、幕末の動乱につながった。"},{"subject":"社会","grade":"中2","unit":"明治維新・近代国家","passage":"改革前：各藩では藩主が家臣を抱え、領内の行政を行っていた。\n改革後：藩はなくなり、府県が置かれ、府知事・県令は中央政府から任命された。","q":"この改革で、地方の統治はどう変わった？","choices":["地方の政治権限を旧藩主へ戻し、地域ごとの独立性を高めた","地方行政を中央政府の下へ組み込み、全国を統一的に治める方向へ進んだ","府県ごとに軍隊・通貨・外交権を持たせ、連邦制へ移行した","江戸幕府の大名統制をそのまま残し、名称だけ藩から府県へ変えた"],"correct":1,"why":"府知事・県令を中央政府が任命する仕組みへ変わったことから、地方行政を中央の統制下に置く中央集権化が進んだと判断できる。"},{"subject":"社会","grade":"中3","unit":"立憲国家の成立","passage":"自由民権運動が全国に広がる中、政府は国会開設を約束し、1889年に大日本帝国憲法が発布され、1890年に帝国議会が開かれた。","q":"この一連の動きによって、日本の政治に加わった仕組みは？","choices":["憲法と議会が設けられ、制限選挙のもとで議会を通じた政治参加の仕組みが始まった","憲法制定と同時に、25歳以上の男女に広く選挙権が認められた","帝国議会が行政と司法も直接担当し、三つの権力を一つにまとめた","憲法制定によって天皇の政治上の権限がなくなり、議会だけが国政を担った"],"correct":0,"why":"大日本帝国憲法と帝国議会により立憲政治の仕組みが整った。ただし当初の選挙権には納税額などの制限があり、普通選挙ではなかった。"},{"subject":"社会","grade":"中3","unit":"日清・日露戦争と東アジア","passage":"明治後期、日本は東アジアの国際関係の中で二つの戦争を経験し、その後、韓国を併合した。","q":"出来事を古い順に並べたものは？","choices":["日清戦争→日露戦争→韓国併合","日露戦争→韓国併合→日清戦争","韓国併合→日清戦争→日露戦争","日露戦争→日清戦争→韓国併合"],"correct":0,"why":"日清戦争は1894～95年、日露戦争は1904～05年、韓国併合は1910年。時系列と東アジアとの関係を結び付けて理解する。"},{"subject":"社会","grade":"中3","unit":"大正デモクラシー","passage":"大正期には政党政治や社会運動が広がり、1925年には普通選挙法が成立した。","q":"普通選挙法で選挙権はどう広がった？","choices":["納税資格をなくし、25歳以上の男性に衆議院議員選挙の選挙権を広げた","納税資格をなくし、25歳以上の男女に衆議院議員選挙の選挙権を広げた","納税資格を残したまま、20歳以上の男性へ選挙権を広げた","25歳以上の男性に選挙権を広げる一方、納税額の条件は以前より高くした"],"correct":0,"why":"1925年の普通選挙法で、衆議院議員選挙の納税要件が撤廃され、25歳以上の男性に選挙権が拡大した。女性参政権は戦後に実現した。"},{"subject":"社会","grade":"中3","unit":"第二次世界大戦後の日本","passage":"第二次世界大戦後、日本では男女普通選挙の実現、日本国憲法の制定、農地改革などの改革が進められた。","q":"これらの改革に共通する方向はどれ？","choices":["政治参加の拡大や権利保障を進め、農村社会の仕組みも改革する民主化の方向","戦前の軍部による政治体制を再建し、統制を強める方向","選挙制度を縮小し、国会より官僚機構を優先する方向","地主の土地所有をさらに集中させ、農村の旧制度を維持する方向"],"correct":0,"why":"男女普通選挙、日本国憲法、農地改革などは内容こそ異なるが、政治参加の拡大、権利保障、社会制度の民主化という方向をもっていた。"},{"subject":"社会","grade":"中3","unit":"日本国憲法・立憲主義","passage":"日本国憲法は、国民主権、基本的人権の尊重、平和主義を基本原理とし、国の政治も憲法に基づいて行われる。","q":"立憲主義とは、どのような考え方？","choices":["憲法は国民の行動だけを制限し、国家機関には原則として制約を設けないという考え","選挙で選ばれた多数派の決定は、憲法上の権利より常に優先するという考え","国家権力の行使を憲法で制約し、個人の権利・自由を保障するという考え","裁判所ではなく行政機関が、憲法に反するかどうかを最終的に決めるという考え"],"correct":2,"why":"立憲主義は、国家権力も憲法に従わせ、権力の濫用から個人の自由や権利を守ろうとする考え方。多数決そのものも憲法の枠内で行われる。"},{"subject":"社会","grade":"中3","unit":"三権分立","passage":"日本では、立法を国会、行政を内閣、司法を裁判所が担い、互いに関係しながら権力を分けている。","q":"三権分立を採るのはなぜ？","choices":["三つの機関が互いに独立し、相手の活動には一切関与しないようにするため","立法・行政・司法を分担し、相互の抑制と均衡によって権力の集中を防ぐため","裁判所が国会と内閣の役割まで担当し、判断を一本化するため","国会で多数を得た政党が司法判断も決定できるようにするため"],"correct":1,"why":"三権分立は単なる「仕事分担」ではなく、立法・行政・司法が相互に抑制し合い、権力の集中や濫用を防ぐ仕組み。"},{"subject":"社会","grade":"中3","unit":"地方自治と政治参加","passage":"地方公共団体では、住民が議会の議員だけでなく、都道府県知事や市区町村長も選挙で直接選ぶ。","q":"この仕組みには、地方自治のどのような特色が表れている？","choices":["首長は国が任命し、住民は地方議会の議員だけを直接選挙で選ぶ仕組みである","住民が首長と議会議員をそれぞれ直接選び、二つの機関を通して地域政治に関わる","地方議会は国会の下部機関なので、地域の事情に応じた条例を定めることはできない","首長と議会議員は同じ名簿から一括して選ばれ、互いに独立した立場をもたない"],"correct":1,"why":"地方自治では、住民が首長と議会議員をそれぞれ直接選ぶ二元代表制が採られている。両者は独立した立場から地域行政を担い、住民には直接請求などの制度もある。"},{"subject":"社会","grade":"中3","unit":"市場経済と価格","passage":"ある商品の市場で、供給量の関係は変わらないまま、その商品を買いたい人が増え、各価格での需要量が以前より多くなった。","q":"他の条件が同じなら、均衡価格と取引量はどう動きやすい？","choices":["均衡価格は上がり、取引量も増える方向に動きやすい","均衡価格は下がり、取引量は増える方向に動きやすい","均衡価格は上がるが、取引量は減る方向に動きやすい","需要曲線が動いても、均衡価格と取引量は変化しない"],"correct":0,"why":"各価格で買いたい量が増え、供給条件が同じなら、需要と供給が一致する点は一般に「より高い価格・より多い取引量」の方向へ動く。"},{"subject":"社会","grade":"中3","unit":"財政・税・社会保障","passage":"ある市では、消防署や公立学校の運営に税金を使っている。また、所得に応じて負担する税と、生活を支えるための給付を組み合わせた制度もある。","q":"この例から、税にはどのような働きがあると分かる？","choices":["利用した人だけから料金を集める仕組みで、所得の違いには関係しない","公共サービスの財源になるとともに、負担と給付を通して所得の偏りを調整する働きもある","商品の販売価格を政府が直接決めるための資金として集められている","国民の貯蓄額の差をなくすことを目的に、所得にかかわらず同額で集められている"],"correct":1,"why":"消防や学校は公共サービスの財源という役割、所得に応じた負担と給付は所得再分配に関わる役割を示している。二つの例をまとめて考える必要がある。"},{"subject":"社会","grade":"中3","unit":"国際社会と国際連合","passage":"国際連合は、紛争地域で停戦を支える活動を行う一方、難民支援、感染症対策、子どもの教育支援などにも関わっている。","q":"これらの活動に共通する国際連合の役割は？","choices":["各国の政府に代わって国内政治を直接運営し、制度を共通化すること","国境を越える課題に対し、平和・安全と人道・社会分野の協力を進めること","紛争への対応だけを担い、難民・保健・教育などは活動の対象にしないこと","人道支援だけを担い、停戦支援や国際的な安全保障には関わらないこと"],"correct":1,"why":"例には停戦支援だけでなく、難民、感染症、教育が含まれている。国連は国境を越える課題について、平和・安全と幅広い国際協力を進める。"}];

const ENGLISH_CURRICULUM=[{"subject":"英語","grade":"中1","unit":"be動詞","passage":"My sister （　　　） a tennis player.","q":"（　　　）に入る語は？","choices":["am","is","are","do"],"correct":1,"why":"主語 My sister は三人称単数なので、be動詞は is を使う。"},{"subject":"英語","grade":"中1","unit":"一般動詞・三人称単数","passage":"Ken usually （　　　） soccer after school.","q":"（　　　）に入る語は？","choices":["play","plays","playing","played"],"correct":1,"why":"現在の習慣を表し、主語 Ken は三人称単数なので、動詞 play に s を付けて plays とする。"},{"subject":"英語","grade":"中1","unit":"一般動詞の疑問文","passage":"「あなたは毎日英語を勉強しますか。」","q":"正しい英文は？","choices":["Are you study English every day?","Do you study English every day?","Does you study English every day?","Do you studies English every day?"],"correct":1,"why":"一般動詞 study の疑問文は Do + 主語 + 動詞の原形。Are は be動詞の文で使い、Does を使うなら主語は三人称単数になる。"},{"subject":"英語","grade":"中1","unit":"代名詞","passage":"I know Yuki. I often talk with （　　　） after school.","q":"（　　　）に入る語は？","choices":["she","her","hers","herself"],"correct":1,"why":"前置詞 with の後には目的格を置く。Yuki を受けるので her。"},{"subject":"英語","grade":"中1","unit":"助動詞 can","passage":"Aya can play the piano.","q":"この文の意味は？","choices":["Aya plays the piano now.","Aya wants to play the piano.","Aya is able to play the piano.","Aya must play the piano."],"correct":2,"why":"この can は能力を表し、「ピアノを弾くことができる」という意味。"},{"subject":"英語","grade":"中1","unit":"現在進行形","passage":"窓の外では、今ちょうど雨が降っている。","q":"この状況を表す英文は？","choices":["It rains now.","It is raining now.","It raining now.","It does rain now."],"correct":1,"why":"今まさに進行中の動作は be動詞 + 動詞のing形で表す。"},{"subject":"英語","grade":"中1","unit":"過去形","passage":"Yesterday, I （　　　） to the library with my friend.","q":"（　　　）に入る語は？","choices":["go","goes","went","going"],"correct":2,"why":"Yesterday があるので過去形を使う。go の過去形は went。"},{"subject":"英語","grade":"中1","unit":"There is / are","passage":"机の上に本が2冊あります。","q":"正しい英文は？","choices":["There is two books on the desk.","There are two books on the desk.","Two books is on the desk.","There are a book on the desk."],"correct":1,"why":"two books は複数なので There are ... を使う。There is は単数名詞に対応する。"},{"subject":"英語","grade":"中1","unit":"疑問詞と語順","passage":"「あなたは放課後、どこでテニスをしますか。」","q":"正しい英文は？","choices":["Where do you play tennis after school?","Where you do play tennis after school?","Do where you play tennis after school?","Where are you play tennis after school?"],"correct":0,"why":"一般動詞の疑問文は 疑問詞 + do + 主語 + 動詞の原形 の語順になる。"},{"subject":"英語","grade":"中1","unit":"短文読解","passage":"Emma lives in Australia.\nShe likes Japanese food and studies Japanese at school.\nOn Saturdays, she sometimes cooks Japanese dishes with her father.\nShe wants to visit Japan someday.","q":"本文から分かることは？","choices":["Emma lives in Japan and studies English at school.","Emma cooks Japanese dishes with her father every Saturday.","Emma sometimes cooks Japanese food with her father.","Emma has already visited Japan several times."],"correct":2,"why":"本文では、EmmaはAustraliaに住み、土曜日に「sometimes」父親と日本料理を作るとある。every Saturday や訪日経験までは書かれていない。"},{"subject":"英語","grade":"中2","unit":"過去進行形","passage":"I （　　　） dinner when you called me.","q":"（　　　）に入る語は？","choices":["cook","cooked","was cooking","am cooking"],"correct":2,"why":"電話がかかってきた時点で「夕食を作っている途中だった」ので、過去進行形 was cooking を使う。"},{"subject":"英語","grade":"中2","unit":"未来表現","passage":"I （　　　） my grandmother this weekend. I already bought a train ticket.","q":"この予定を表す形は？","choices":["am going to visit","visited","was visiting","have visited"],"correct":0,"why":"すでに決めている未来の予定を表すので be going to + 動詞の原形が適切。"},{"subject":"英語","grade":"中2","unit":"不定詞・目的","passage":"I went to the store to buy some milk.","q":"to buy と同じく「〜するために」という目的を表すものは？","choices":["I want to play tennis.","I have homework to do.","She came here to see her friend.","To read books is interesting."],"correct":2,"why":"She came here to see her friend. の to see は「友達に会うために」という目的を表す。"},{"subject":"英語","grade":"中2","unit":"動名詞","passage":"My brother enjoys （　　　） pictures.","q":"（　　　）に入る語は？","choices":["take","takes","taking","to took"],"correct":2,"why":"enjoy の後には動名詞を置くので taking。"},{"subject":"英語","grade":"中2","unit":"比較級","passage":"River A is 120 km long.\nRiver B is 180 km long.","q":"二つの川を正しく比べている英文は？","choices":["River A is longer than River B.","River B is longer than River A.","River B is longest River A.","River A is more long than River B."],"correct":1,"why":"River B の方が長いので River B is longer than River A. が正しい。long の比較級は longer。"},{"subject":"英語","grade":"中2","unit":"最上級","passage":"Ken: 160 cm\nTaku: 168 cm\nHiro: 172 cm","q":"3人について正しく表している英文は？","choices":["Hiro is taller than all.","Hiro is the tallest of the three.","Hiro is the more tall of the three.","Hiro is tallest than Ken."],"correct":1,"why":"3人の中で最も背が高いので最上級 the tallest を使う。"},{"subject":"英語","grade":"中2","unit":"接続詞","passage":"I stayed home （　　　） it was raining heavily.","q":"（　　　）に入る語は？","choices":["but","because","or","so"],"correct":1,"why":"「激しく雨が降っていた」が家にいた理由なので、理由を表す because が適切。"},{"subject":"英語","grade":"中2","unit":"受け身","passage":"Many people use this park.\nThis park （　　　） by many people.","q":"二文がほぼ同じ意味になるように、（　　　）に入る形は？","choices":["uses","used","is used","is using"],"correct":2,"why":"動作を受ける this park を主語にするので、be動詞 + 過去分詞の受け身 is used を使う。"},{"subject":"英語","grade":"中2","unit":"会話・意図","passage":"A: Would you like to come to the school festival with me?\nB: I'd love to, but I have a soccer game at the same time.","q":"Bが伝えたいことは？","choices":["行きたい気持ちはあるが、同じ時間に別の予定があって行けない","学校祭には興味がないので、行きたくない","Aをサッカーの試合へ誘い返している","サッカーの試合があるかどうか、まだ分からない"],"correct":0,"why":"I’d love to は「ぜひ行きたい」という気持ちを示す。一方、but 以下で「同じ時間にサッカーの試合がある」と述べているので、行きたいが参加できないという意図だと分かる。"},{"subject":"英語","grade":"中2","unit":"実用的な読解","passage":"SCHOOL LIBRARY\nMon–Fri  8:00–17:30\nSat  9:00–12:00\nClosed on Sundays\nStudents may borrow up to three books for two weeks.","q":"本文から分かることは？","choices":["土曜日の午後も利用できる","日曜日は利用できない","本は一度に1冊しか借りられない","借りた本はその日のうちに返す"],"correct":1,"why":"Closed on Sundays とあるので日曜日は利用できない。利用時間や貸出条件も、必要な情報を探して読むことが大切。"},{"subject":"英語","grade":"中3","unit":"現在完了・経験","passage":"I （　　　） Kyoto three times.","q":"「これまでに3回訪れた」という経験を表す形は？","choices":["visit","visited","have visited","am visiting"],"correct":2,"why":"過去から現在までの経験を表すので、現在完了 have + 過去分詞を使う。"},{"subject":"英語","grade":"中3","unit":"現在完了進行形","passage":"I （　　　） English since this morning, and I'm still studying now.","q":"（　　　）に入る形は？","choices":["studied","am studying","have been studying","was studying"],"correct":2,"why":"朝から始まった動作が今も続いているので、現在完了進行形 have been studying が適切。"},{"subject":"英語","grade":"中3","unit":"関係代名詞","passage":"I have a friend. He can speak three languages.","q":"二文を一文にすると？","choices":["I have a friend who can speak three languages.","I have a friend which can speak three languages.","I have who a friend can speak three languages.","I have a friend he can speak three languages."],"correct":0,"why":"先行詞 a friend は人なので、主格の関係代名詞 who を使って後ろから説明できる。"},{"subject":"英語","grade":"中3","unit":"分詞による修飾","passage":"The boy （　　　） by the window is my brother.","q":"「窓のそばで立っている少年」という意味になるように、（　　　）に入る語は？","choices":["stand","stands","standing","stood"],"correct":2,"why":"standing by the window が前の the boy を後ろから修飾している。"},{"subject":"英語","grade":"中3","unit":"want + 人 + to不定詞","passage":"My mother wants me （　　　） home before six.","q":"（　　　）に入る形は？","choices":["come","to come","coming","came"],"correct":1,"why":"want + 人 + to不定詞 で「人に〜してほしい」を表すので wants me to come。"},{"subject":"英語","grade":"中3","unit":"間接疑問","passage":"Do you know （　　　）?\n「彼がどこに住んでいるか知っていますか。」","q":"「彼がどこに住んでいるか」という意味になるように、（　　　）に入る形は？","choices":["where does he live","where he lives","where is he living","does he live where"],"correct":1,"why":"間接疑問では、疑問詞の後ろを疑問文の語順にせず「主語＋動詞」とする。したがって where he lives。"},{"subject":"英語","grade":"中3","unit":"仮定法","passage":"If I were you, I would talk to her.","q":"この英文の意味は？","choices":["私があなたなので、彼女と話す","もし私があなたの立場なら、彼女と話すだろう","あなたが彼女と話したら、私は怒る","私が彼女と話したことを、あなたは知っている"],"correct":1,"why":"実際には「私＝あなた」ではない状況を仮定し、相手への助言を表している。"},{"subject":"英語","grade":"中3","unit":"情報を結び付ける読解","passage":"EVENT NOTICE\nClean-up Day: Saturday, Oct. 10, 9:00–11:00\nMeet at Green Park. Bring gloves.\n\nMika's message:\nI have a piano lesson until 9:30 on Saturday, but I want to join after that.","q":"本文から確実に言えることは？","choices":["Mika's piano lesson ends before Clean-up Day starts.","Mika's lesson ends at 9:30, and Clean-up Day ends at 11:00.","The notice says that people who arrive after 9:00 cannot join.","Mika does not need to bring gloves if she joins after 9:30."],"correct":1,"why":"案内ではClean-up Dayは9:00〜11:00、Mikaのメッセージではピアノのレッスンは9:30までとある。この二つを組み合わせると、レッスン終了時にもイベントは続いていることまで確実に言える。"},{"subject":"英語","grade":"中3","unit":"指示語・文章のつながり","passage":"Our school started a food-sharing project last year.\nStudents bring food that they cannot use at home, and the school sends it to a local support center.\nAt first, only a few students joined the project.\nNow, more than one hundred students take part in it.","q":"最後の it が指しているものは？","choices":["the school","the food students bring","the local support center","the food-sharing project"],"correct":3,"why":"take part in は「〜に参加する」。直前の only a few students joined the project と対応し、it は food-sharing project を指す。"},{"subject":"英語","grade":"中3","unit":"長文読解・主題","passage":"When Haru first joined the science club, he wanted to win a contest.\nHis team built a small robot, but it did not work well.\nThey changed the design many times and asked other students for advice.\nIn the end, they did not win the contest.\nHaru was disappointed at first, but later he said, \"We learned more from fixing our mistakes than we would have learned from an easy success.\"","q":"Haruはこの経験から何を学んだ？","choices":["Winning a contest is more important than what a team learns while improving its work.","Once a team chooses a design, changing it usually makes the project less successful.","Trying, revising, and learning from mistakes can be valuable even when a team does not win.","Getting advice from other people prevents a team from learning through its own mistakes."],"correct":2,"why":"Haru says they learned more from fixing their mistakes than from an easy success. The main idea is the value of trying, revising, and learning even without winning."}];

const SCIENCE_CURRICULUM=[{"subject":"理科","grade":"中1","unit":"生物の分類","passage":"次の特徴をすべて満たす植物は（　　　）。\n・花が咲く\n・種子ができる\n・葉脈は平行\n・根は細いものが多数広がる","q":"（　　　）に入る植物は？","choices":["アブラナ","イネ","ゼンマイ","マツ"],"correct":1,"why":"平行脈とひげ根は単子葉類に多い特徴。花が咲き、種子をつくる単子葉類のイネが当てはまる。複数の特徴を組み合わせて分類する。"},{"subject":"理科","grade":"中1","unit":"動物の分類","passage":"背骨があり、子は水中で育ち、成体は肺や皮膚でも呼吸する動物は（　　　）。","q":"（　　　）に入る動物は？","choices":["メダカ","カエル","トカゲ","バッタ"],"correct":1,"why":"カエルは脊椎動物の両生類。幼生は水中で生活し、成体では肺や皮膚を使って呼吸する。"},{"subject":"理科","grade":"中1","unit":"物質の性質・密度","passage":"質量54g、体積20cm³の物体がある。","q":"この物体の密度は？","choices":["0.37g/cm³","2.7g/cm³","34g/cm³","74g/cm³"],"correct":1,"why":"密度＝質量÷体積。54÷20＝2.7g/cm³。密度は物質を見分ける手掛かりになる。"},{"subject":"理科","grade":"中1","unit":"気体の性質","passage":"水にほとんど溶けない気体を、できるだけ空気と混ぜずに集めたい。","q":"この気体は、どの方法で集める？","choices":["水より密度が小さい気体だけに使う上方置換法","空気より密度が大きい気体だけに使う下方置換法","水に溶けにくい性質を利用する水上置換法","沸点の違いを利用して液体を分ける蒸留"],"correct":2,"why":"水上置換法は、気体が水に溶けにくいことを利用して水と置き換えて集める方法。上方・下方置換は主に空気との密度差を利用する。"},{"subject":"理科","grade":"中1","unit":"水溶液と状態変化","passage":"食塩水を加熱し、水をすべて蒸発させると、容器の底に食塩が残った。","q":"この結果を正しく説明しているのは？","choices":["食塩も水と一緒に蒸発したため、見えない気体として容器外へ出た","水が蒸発し、溶けていた食塩は固体として残った","加熱によって食塩が水へ化学変化した","水と食塩が反応して新しい物質ができた"],"correct":1,"why":"食塩が水に溶けることは化学変化ではない。水だけが蒸発すると、溶けていた食塩を固体として取り出せる。"},{"subject":"理科","grade":"中1","unit":"光の反射","passage":"鏡に光を当てると、法線と入射光のなす角が35°だった。","q":"反射角は？","choices":["17.5°","35°","55°","70°"],"correct":1,"why":"反射の法則では入射角＝反射角。角度は鏡の面ではなく法線から測る。"},{"subject":"理科","grade":"中1","unit":"音の性質","passage":"AとBは同じ高さの音で、Bの方が大きく聞こえた。","q":"Bの振動はAと比べて一般にどうなっている？","choices":["振幅が大きく、振動数はAとほぼ同じ","振幅はAとほぼ同じで、振動数が大きい","振幅が小さく、振動数はAとほぼ同じ","振幅も振動数もAより大きい"],"correct":0,"why":"音の大きさは主に振幅、音の高さは主に振動数と関係する。「同じ高さで、Bの方が大きい」ので、Bは振動数がほぼ同じで振幅が大きい。"},{"subject":"理科","grade":"中1","unit":"力とばね","passage":"同じばねで、1N→2cm、2N→4cm、3N→6cmと伸びた。このばねでは4Nまで、加える力と伸びが比例する。","q":"4Nの力を加えると、ばねの伸びは何cmになる？","choices":["6cm","7cm","8cm","12cm"],"correct":2,"why":"4Nまで力と伸びが比例するという条件から、1N増えるごとに伸びが2cm増える。したがって4Nでは8cm。比例が成り立つ範囲を確かめてから計算する。"},{"subject":"理科","grade":"中1","unit":"地層と火山","passage":"地点Pと地点Qは20km離れている。両地点から、鉱物の組合せと色がよく似た薄い火山灰層が見つかり、その上下にはそれぞれ別の砂岩・泥岩の層がある。","q":"PとQの地層を対応させる手掛かりとして、この火山灰層が特に役立つ理由は？","choices":["同じ噴火で短期間に広く積もった層なら、離れた地点の同じ時期を示す目印にできるから","火山灰の層が同じ厚さなら、成分が違っていても同じ時期の地層と判断できるから","火山灰の上下が砂岩と泥岩なら、火山灰の特徴を比べなくても同時期と判断できるから","火山灰の色が似ていれば、噴火源や鉱物の組合せを調べずに同じ層と判断できるから"],"correct":0,"why":"同じ噴火による火山灰が広い範囲に短時間で堆積したと考えられる場合、その層は離れた地点の地層を同時期として対応させる「鍵層」の手掛かりになる。"},{"subject":"理科","grade":"中1","unit":"地震","passage":"ある地震で、P波は10時15分20秒、S波は10時15分32秒に到着した。","q":"この地点の初期微動継続時間は？","choices":["8秒","10秒","12秒","52秒"],"correct":2,"why":"初期微動継続時間はP波到着からS波到着まで。32−20＝12秒。"},{"subject":"理科","grade":"中2","unit":"物質の分解","passage":"酸化銀を加熱すると、銀と酸素ができた。","q":"この変化を何という？","choices":["複数の物質が結び付いて一つの物質になる化合","一つの物質から二種類以上の物質が生じる分解","物質の種類は変わらず、状態だけが変化する現象","酸化銀から酸素だけが失われ、残った物質も酸化銀のままである変化"],"correct":1,"why":"酸化銀という一つの物質から、銀と酸素という別の物質が生じているので分解。状態変化では物質の種類そのものは変わらない。"},{"subject":"理科","grade":"中2","unit":"化学反応式","passage":"水素と酸素が反応して水ができる。","q":"原子の数が反応の前後で合っている化学反応式は？","choices":["H₂＋O₂ → H₂O","2H₂＋O₂ → 2H₂O","H₂＋2O₂ → H₂O","2H＋O → H₂O"],"correct":1,"why":"2H₂＋O₂→2H₂Oなら、水素原子4個、酸素原子2個で反応前後の原子数が一致する。"},{"subject":"理科","grade":"中2","unit":"化学変化と質量","passage":"密閉容器の中で、物質A 5.0gと物質B 3.0gを完全に反応させた。","q":"反応後の物質全体の質量は？","choices":["2.0g","5.0g","8.0g","反応するたびに変わる"],"correct":2,"why":"密閉した系では化学変化の前後で全体の質量は保存される。5.0＋3.0＝8.0g。"},{"subject":"理科","grade":"中2","unit":"細胞と光合成","passage":"緑色の葉の細胞を顕微鏡で観察すると、多数の緑色の粒が見えた。","q":"この粒は、光合成とどのように関わる？","choices":["葉緑体で光エネルギーを利用して光合成が行われる","核で光を吸収し、二酸化炭素を酸素に直接変える","細胞壁が光を受けてデンプンを合成する","液胞が光を吸収し、葉緑体へ酸素を供給する"],"correct":0,"why":"葉の緑色の粒は葉緑体。葉緑体に含まれる葉緑素が光を受け、光合成が行われる。核・細胞壁・液胞には別の役割がある。"},{"subject":"理科","grade":"中2","unit":"消化・吸収・循環","passage":"小腸で吸収されたブドウ糖などの養分は、その後、体の各部分へ運ばれる。","q":"養分を全身へ運ぶ働きを主に担うものは？","choices":["血液","骨","筋肉","皮膚"],"correct":0,"why":"小腸で吸収された養分は血液に入り、循環によって全身の細胞へ運ばれる。消化・吸収・循環は連続した働きとして捉える。"},{"subject":"理科","grade":"中2","unit":"刺激と反応","passage":"熱いものに触れ、すぐに手を引っ込めた。","q":"刺激はどの経路で伝わる？","choices":["感覚器官→感覚神経→中枢神経→運動神経→筋肉","筋肉→運動神経→感覚神経→中枢神経→感覚器官","中枢神経→感覚器官→筋肉→感覚神経→運動神経","感覚器官→筋肉→血液→中枢神経→運動神経"],"correct":0,"why":"刺激は感覚器官で受け取られ、感覚神経を通って中枢神経へ伝わり、そこから運動神経を通って筋肉へ命令が伝わる。"},{"subject":"理科","grade":"中2","unit":"電流・電圧・抵抗","passage":"ある抵抗に6Vの電圧を加えると、0.3Aの電流が流れた。","q":"この抵抗の大きさは？","choices":["1.8Ω","5Ω","20Ω","30Ω"],"correct":2,"why":"抵抗＝電圧÷電流。6÷0.3＝20Ω。電流・電圧・抵抗の関係を数値で捉える。"},{"subject":"理科","grade":"中2","unit":"電磁誘導","passage":"コイルに検流計をつなぎ、磁石をコイルの中へ動かすと電流が流れた。","q":"検流計の振れを大きくするには？","choices":["磁石をより速く動かす","磁石をコイルの中で静止させる","コイルと磁石を遠ざけたまま動かさない","回路を切っておく"],"correct":0,"why":"磁界の変化が大きいほど誘導電流は大きくなりやすい。磁石を速く動かすと、コイルを貫く磁界の変化が大きくなる。"},{"subject":"理科","grade":"中2","unit":"湿度","passage":"気温20℃、飽和水蒸気量17.3g/m³、実際の水蒸気量8.65g/m³だった。","q":"このときの湿度は？","choices":["25％","50％","75％","100％"],"correct":1,"why":"湿度＝実際の水蒸気量÷飽和水蒸気量×100。8.65÷17.3×100＝50％。"},{"subject":"理科","grade":"中2","unit":"前線と天気","passage":"ある地点を寒冷前線が通過した。","q":"寒冷前線の通過後、どのような変化が起こりやすい？","choices":["通過後は気温が低下しやすく、風向や気圧にも変化が見られる","通過後は暖気に覆われるため、気温は上昇し続ける","前線通過後は風向だけが変わり、気温や気圧は変化しない","寒冷前線は停滞する前線なので、短時間の天気変化は起こりにくい"],"correct":0,"why":"寒冷前線では寒気が暖気の下へ入り込み、通過後は寒気側に入るため気温が低下しやすい。気圧・風向・降水なども前線通過に伴って変化する。"},{"subject":"理科","grade":"中3","unit":"水溶液とイオン","passage":"食塩水には電流が流れるが、砂糖水にはほとんど流れない。","q":"食塩水が電流を通す理由は？","choices":["食塩が水中でイオンに分かれ、正負のイオンが移動して電気を運ぶから","食塩の粒そのものが電荷をもつ一つのかたまりとして水中を移動するから","水に物質が溶けると、水分子だけが電気を運ぶようになるから","食塩が水に溶けると水温が上がり、その熱によって電流が流れるから"],"correct":0,"why":"食塩は水中でNa⁺とCl⁻などのイオンとして存在し、それらが移動できるため電流が流れる。溶ける物質がすべて電流を通すわけではない。"},{"subject":"理科","grade":"中3","unit":"酸・アルカリと中和","passage":"塩酸と水酸化ナトリウム水溶液を混ぜた。","q":"中和で直接結び付いて水になる組み合わせは？","choices":["H⁺ と OH⁻","Na⁺ と H⁺","Cl⁻ と OH⁻","Na⁺ と Cl⁻"],"correct":0,"why":"中和ではH⁺とOH⁻が結び付いてH₂Oになる。酸・アルカリの性質をイオンで説明する。"},{"subject":"理科","grade":"中3","unit":"電池","passage":"2種類の金属と電解質水溶液を使った電池から電流を取り出した。","q":"このときの主なエネルギー変換は？","choices":["化学エネルギーの一部が電気エネルギーへ変換される","電気エネルギーの一部が化学エネルギーへ変換されるだけで、電流は取り出せない","金属の位置エネルギーが直接電気エネルギーへ変換される","水溶液の熱エネルギーだけが電気エネルギーへ変換される"],"correct":0,"why":"電池では酸化還元などの化学変化に伴う化学エネルギーを、外部回路で利用できる電気エネルギーとして取り出す。"},{"subject":"理科","grade":"中3","unit":"細胞分裂","passage":"ある体細胞では、分裂前に染色体のDNA量が増えた。その後できた二つの細胞を調べると、どちらも分裂前の細胞と同じ種類・数の染色体をもっていた。","q":"この結果は、どのしくみで説明できる？","choices":["染色体が複製されたあと、二つの細胞へほぼ同じように分配された","分裂のたびに染色体の半分を捨て、残りを二つの細胞で共有した","細胞質だけが二つに分かれ、染色体は一方の細胞にまとめて残った","分裂後に外部から新しい染色体を取り込み、元の数へ戻した"],"correct":0,"why":"分裂前に染色体が複製され、その後二つの娘細胞へ同じように分配されるため、分裂後も同じ種類・数の染色体を保てる。"},{"subject":"理科","grade":"中3","unit":"遺伝","passage":"純系の丸い種子をつくる個体と、純系のしわのある種子をつくる個体を交配すると、子の種子はすべて丸くなった。","q":"この結果から、丸い形質としわの形質について何が言える？","choices":["この交配では、丸い形質が顕性、しわの形質が潜性として現れたと考えられる","一代目にしわが現れなかったので、しわに関する遺伝情報は子へ受け継がれていない","丸い形質としわの形質が同時に表れ、子の種子には二つの形が混ざって現れた","一代目が同じ形になったので、種子の形は親から遺伝せず、育て方だけで決まる"],"correct":0,"why":"純系どうしの交配で一代目がすべて丸くなった結果から、この組合せでは丸い形質が顕性、しわの形質が潜性として現れたと考えられる。表面に現れない形質の遺伝情報も受け継がれ得る。"},{"subject":"理科","grade":"中3","unit":"力と運動","passage":"なめらかな水平面上を、物体が一定の速さでまっすぐ進んでいる。物体にはたらく力はつり合っている。","q":"このあと、物体はどう運動する？","choices":["合力が0なので、同じ速さ・同じ向きの運動を続ける","力がつり合うと速度は少しずつ小さくなり、やがて止まる","力がつり合うと進行方向は変わらないが、速さだけが増える","一定の速さで進むには進行方向の力が必要なので、力がつり合っていても次第に速さが変わる"],"correct":0,"why":"力がつり合い合力が0なら、物体の運動状態は変化しない。静止していれば静止を続け、運動中なら等速直線運動を続ける。"},{"subject":"理科","grade":"中3","unit":"力学的エネルギー","passage":"摩擦を無視できるジェットコースターが、高い位置から下って最下点へ進む。","q":"下る途中、エネルギーはどう変化する？","choices":["位置エネルギーが減り、その分運動エネルギーが増える","位置エネルギーは減るが、運動エネルギーも同じだけ減る","位置エネルギーは一定で、運動エネルギーだけが増える","運動エネルギーが位置エネルギーへ変わるため、下るほど遅くなる"],"correct":0,"why":"下ると高さが下がるので位置エネルギーは減り、速さが増すので運動エネルギーが増える。摩擦を無視すれば両者の和である力学的エネルギーは一定。"},{"subject":"理科","grade":"中3","unit":"地球の自転","passage":"日本で星を観察すると、多くの星が東から西へ動いて見える。","q":"この見かけの動きの主な原因は？","choices":["地球が西から東へ自転するため、天体が反対向きに動くように見える","地球が太陽の周りを西から東へ公転するため、1日の間に星が東から西へ動く","恒星が地球を中心として約24時間で一周しているため","月の公転によって恒星全体が毎日東から西へ動かされるため"],"correct":0,"why":"地球が西から東へ約24時間で自転するため、地上からは天体が反対方向の東から西へ日周運動しているように見える。"},{"subject":"理科","grade":"中3","unit":"季節の変化","passage":"日本が夏のころ、南半球のオーストラリアでは冬になる。同じ時期でも、北半球と南半球では昼の長さや太陽の高さの変化が逆になる。","q":"この現象は、地球のどの運動で説明できる？","choices":["地軸を傾けた向きをほぼ保ったまま、地球が太陽の周りを公転する","地軸を公転面に垂直に保ち、太陽との距離だけを大きく変える","自転速度を半年ごとに変え、昼と夜の長さを調整する","太陽の表面温度が半年周期で変わり、南北半球へ交互に熱を送る"],"correct":0,"why":"地球は地軸を傾けた状態をほぼ保って公転するため、同じ時期に北半球と南半球で太陽高度や昼の長さが逆向きに変化し、季節も反対になる。"},{"subject":"理科","grade":"中3","unit":"生態系と自然環境","passage":"ある地域で昆虫を食べる小鳥が急に減った。数か月後、昆虫は以前より増え、小鳥を主な餌にしていた猛禽類は減る傾向が見られた。","q":"この変化から、食物網についてどのように考えられる？","choices":["一つの種の増減が、捕食・被食の関係を通して複数の種へ波及することがある","小鳥が減ると、その餌と捕食者はいずれも小鳥と同じ方向に増減すると考えられる","直接食べ合う二種の間だけで影響が起こり、それ以外の種へは広がらない","猛禽類の変化は小鳥の個体数とは切り離し、食物関係を使わずに考える必要がある"],"correct":0,"why":"小鳥の減少後に昆虫が増え、猛禽類が減っている。食物網では、一つの種の変化が餌や捕食者を通して別の種へ波及することがある。"}];

const MUSIC_CURRICULUM=[{"subject":"音楽","grade":"中1","unit":"音符と休符","passage":"4分音符1個を1拍として数える。","q":"2分音符1個は何拍分？","choices":["1/2拍","1拍","2拍","4拍"],"correct":2,"why":"2分音符は4分音符2個分の長さなので2拍。音符の種類と、それぞれの音の長さの関係を押さえる。"},{"subject":"音楽","grade":"中1","unit":"拍子","passage":"3/4拍子では、4分音符を1拍として数える。","q":"3/4拍子を正しく説明しているのは？","choices":["4分音符を1拍として、1小節に3拍ある","8分音符を1拍として、1小節に6拍を大きな2拍にまとめる","4分音符を1拍として、1小節に4拍ある","2分音符を1拍として、1小節に3拍ある"],"correct":0,"why":"3/4拍子の分母4は4分音符を1拍とすること、分子3は1小節に3拍あることを表す。"},{"subject":"音楽","grade":"中1","unit":"強弱記号","passage":"楽譜に p と書かれている。","q":"p は、どのように演奏する指示？","choices":["強く","弱く","だんだん速く","だんだん遅く"],"correct":1,"why":"pはpiano（ピアノ）の略で「弱く」。fはforte（フォルテ）で「強く」を表す。"},{"subject":"音楽","grade":"中1","unit":"速度と表現","passage":"曲の途中に rit. と記されている。","q":"rit. は、どのように演奏する指示？","choices":["だんだん速くする","だんだん遅くする","急に強くする","同じ音を短く切り続ける"],"correct":1,"why":"rit.はritardandoの略で、だんだん遅くする指示。音の強さではなく速度の変化を表す。"},{"subject":"音楽","grade":"中1","unit":"旋律","passage":"旋律がド→レ→ミ→ファ→ソと進む。","q":"この旋律の動きとして最も適切なのは？","choices":["隣り合う音へ順に上がる上行の順次進行","同じ高さを保ったままリズムだけが変化する反復","隣り合う音へ順に下がる下行の順次進行","音程を一つ以上飛ばして進む跳躍進行"],"correct":0,"why":"ド→レ→ミ→ファ→ソは隣り合う音へ順に上がっている。旋律は「上行・下行」「順次・跳躍」「反復」などの観点で捉えられる。"},{"subject":"音楽","grade":"中1","unit":"音楽の構成","passage":"ある曲は A → A → B → A というまとまりでできている。","q":"A→A→B→A という構成には、どのような効果がある？","choices":["Aの反復が統一感をつくり、Bとの違いが変化を生み出している","Aが繰り返されるため、Bは曲の構成上の役割をもたない","AとBが異なるため、曲全体のまとまりは生まれない","Aが同じ記号なら、演奏する音高・音色・強弱も同じようにそろえる必要がある"],"correct":0,"why":"Aの反復は統一感をつくり、異なるBは対比や変化を生む。構成を考えるときは「同じ部分」と「異なる部分」の関係を見る。"},{"subject":"音楽","grade":"中1","unit":"歌唱・合唱","passage":"合唱では複数のパートが同時に歌って、一つの響きをつくる。","q":"自分のパートを歌いながら他のパートも聴くことが大切なのはなぜ？","choices":["自分のパートの音量を一定に保ち、他のパートの変化には左右されないようにするため","各パートの役割を聴き合い、音量・音程・発音を調整して全体の響きを整えるため","各パートの音量や歌い方をそろえ、声部ごとの役割の違いを小さくするため","他のパートの入りだけを確認し、自分が歌い始めた後は自分の声に集中するため"],"correct":1,"why":"合唱では各声部が異なる役割をもつ。互いの音を聴き、音量・音程・発音などを調整することで、全体としてまとまりのある響きになる。"},{"subject":"音楽","grade":"中1","unit":"音色","passage":"同じ高さ、同じくらいの大きさの音でも、フルートとバイオリンは聞き分けられる。","q":"二つの楽器を聞き分けられるのは、主に何が違うため？","choices":["拍子","音色","小節数","調号"],"correct":1,"why":"楽器や声によって異なる音の特徴を音色という。高さや大きさが同じでも、含まれる響き方などが異なるため聞き分けられる。"},{"subject":"音楽","grade":"中1","unit":"日本の伝統音楽","passage":"竹で作られ、縦に構えて息を吹き込み、五つの指孔を使って演奏する日本の伝統楽器である。","q":"この楽器は？","choices":["尺八","クラリネット","トランペット","チェロ"],"correct":0,"why":"尺八は竹で作られる日本の伝統的な管楽器。名前だけでなく、形や演奏方法も結び付けて覚える。"},{"subject":"音楽","grade":"中1","unit":"鑑賞・表現","passage":"Aさん「だんだん音が大きくなっていくので、何かが近づいてくるように感じた。」\nBさん「なんとなくすごい曲だと思った。」","q":"音楽の特徴を根拠として、自分の感じたことを説明しているのは？","choices":["Aさん。音量の変化という音楽の特徴と、そこから受けた印象を結び付けている","Bさん。評価を短く言い切っているので、Aさんより根拠が明確である","二人とも。感想であれば、音楽の特徴を示さなくても同じ程度に根拠がある","どちらでもない。音楽の鑑賞では感じたことを言葉にしてはいけない"],"correct":0,"why":"Aさんは「だんだん音が大きくなる」という聴き取れる特徴を根拠に「近づいてくるよう」と説明している。鑑賞では印象と音楽的な根拠を結び付ける。"},{"subject":"音楽","grade":"中2","unit":"付点音符","passage":"4分音符を1拍として数える。付点は、元の音符の半分の長さを加える記号である。","q":"付点4分音符1個の長さは？","choices":["1拍","1.5拍","2拍","3拍"],"correct":1,"why":"4分音符1拍に、その半分の8分音符0.5拍が加わるので1.5拍。付点は元の音符の長さを1.5倍にする。"},{"subject":"音楽","grade":"中2","unit":"6/8拍子","passage":"6/8拍子について考える。1小節は8分音符6個分の長さである。","q":"6/8拍子の捉え方はどれ？","choices":["8分音符6個分を、3個ずつの二つのまとまりとして大きな2拍に感じることが多い","8分音符6個分を、2個ずつの三つのまとまりとして大きな3拍に感じることが多い","4分音符3個分なので、3/4拍子と同じ拍のまとまりとして感じる","8分音符6個を、それぞれ同じ強さの6拍として数えるのが基本である"],"correct":0,"why":"6/8拍子は8分音符6個分だが、通常は3個＋3個にまとめ、付点4分音符を単位にした大きな2拍として感じる。"},{"subject":"音楽","grade":"中2","unit":"タイ","passage":"同じ高さの二つの音符が、弧で結ばれている。","q":"このタイの働きとして正しいのはどれ？","choices":["同じ高さの二音を一続きにし、後の音を打ち直さず二つの音価を足して伸ばす","異なる高さの二音を一つのフレーズとして結び、音高を滑らかに移して演奏する","結ばれた後ろの音だけを強くし、アクセントの位置を指定して演奏する","二つの音の間を無音にし、弧で示された長さだけ休符として間を取る"],"correct":0,"why":"タイは同じ高さの二音を結び、後ろの音を打ち直さず音価を合計する記号。異なる高さの音をフレーズとして結ぶスラーとは区別する。"},{"subject":"音楽","grade":"中2","unit":"テクスチュア","passage":"ある楽節では、一つの声部がまとまった旋律を進め、その下で和音をつくる音が別のリズムで同時に鳴っている。","q":"この部分の音の重なり方を説明しているのは？","choices":["主旋律と伴奏が異なる役割をもち、別の動きをしながら同時に重なっている","すべての声部が同じ旋律と同じリズムを演奏し、完全なユニゾンになっている","主旋律と伴奏が交互に現れ、同時には一度も鳴らない","伴奏だけが続き、聞き手が中心として捉える旋律は存在しない"],"correct":0,"why":"上声部の主旋律と下声部の伴奏が同時に鳴り、それぞれ違う役割・リズムをもっている。これは音楽のテクスチュアを捉える材料になる。"},{"subject":"音楽","grade":"中2","unit":"和音","passage":"ド・ミ・ソの三つの音を、順番ではなく同時に鳴らしている。","q":"ド・ミ・ソを同時に鳴らした響きをどう捉える？","choices":["異なる高さの音が同時に鳴り、和音として響いている","ド→ミ→ソの順に一音ずつ鳴るので、旋律だけをつくっている","三つの音が同じ高さに変化し、ユニゾンになっている","音の高さではなく、休符の組合せによって和音をつくっている"],"correct":0,"why":"ド・ミ・ソを同時に鳴らすと、異なる高さの音が同時に響く「和音」になる。旋律は音が時間的に並ぶ点が異なる。"},{"subject":"音楽","grade":"中2","unit":"形式と構成","passage":"ある曲は A → B → A という三つの部分でできている。AとBでは旋律や雰囲気が大きく異なる。","q":"この構成が生み出す効果はどれ？","choices":["AとBの対比が変化をつくり、最後にAが戻ることで統一感も生まれる","Aが再び現れるため、Bで生まれた対比は消えてしまう","AとBが異なる場合、全体を一つの曲としてまとめることはできない","A-B-Aという順序だけで、強弱やテンポも自動的に決まる"],"correct":0,"why":"A-B-Aは、異なるBによる対比と、Aの再現による統一感を両立しやすい構成。形式は曲の時間的なまとまりを捉える手掛かりになる。"},{"subject":"音楽","grade":"中2","unit":"アーティキュレーション","passage":"同じ旋律を、①音を短く区切る、②音をなめらかにつなぐ、の二通りで演奏する。","q":"②のようになめらかにつなげて演奏する指示は？","choices":["レガート","スタッカート","フォルテ","リタルダンド"],"correct":0,"why":"レガートは音と音をなめらかにつなぐ表現。スタッカートは音を短く切る。強弱や速度ではなく、音のつなぎ方に関わる。"},{"subject":"音楽","grade":"中2","unit":"アンサンブル","passage":"同じ部分を二回録音した。\n録音A：伴奏が前に出て、フルートの旋律が聞き取りにくい。\n録音B：伴奏を少し抑えると、旋律も伴奏の動きも聞き分けやすくなった。","q":"録音Bで改善された点は？","choices":["主旋律と伴奏の役割が伝わるよう、録音で聞こえ方を確かめて音量のバランスを調整した","伴奏の役割に関係なく、曲全体を通して同じ割合だけ伴奏の音量を下げた","主旋律を目立たせるため、伴奏がほとんど聞こえないところまで音量を下げた","音量の差は変えず、テンポを調整することで旋律と伴奏を聞き分けやすくした"],"correct":0,"why":"録音AとBの違いは伴奏の音量。実際の聞こえ方を確かめ、主旋律と伴奏の役割が伝わるバランスへ調整したと考えられる。"},{"subject":"音楽","grade":"中2","unit":"日本の伝統音楽","passage":"横に置いた長い胴に弦を張り、柱（じ）で音の高さを調整し、弦をはじいて演奏する日本の伝統楽器である。","q":"この楽器は？","choices":["箏（こと）","尺八","小鼓","篳篥"],"correct":0,"why":"箏は横長の胴に弦を張り、柱を動かして音高を調整し、爪などで弦をはじいて演奏する。形・奏法・音の仕組みを結び付けて覚える。"},{"subject":"音楽","grade":"中2","unit":"鑑賞・表現の根拠","passage":"ある楽節では、旋律が低い音域から少しずつ上昇し、同時にpからfへクレッシェンドしている。","q":"この二つの変化から、どのような表現効果が考えられる？","choices":["音域の上昇とクレッシェンドが重なることで、緊張や高まりを強めている","音域が高くなることから、テンポも同時に速くなったと判断できる","強弱がpからfへ変わるので、旋律の音高は変化していないと判断できる","音域と強弱は別の要素なので、二つを関連付けて曲の印象を考えることはできない"],"correct":0,"why":"本文では「音域が上がる」「pからfへ強くなる」という二つの変化が示されている。二つが重なることで高まりを感じさせる、と根拠をもって説明できる。"},{"subject":"音楽","grade":"中3","unit":"リズムと拍","passage":"4/4拍子で、強調される音が拍の表ではなく、拍と拍の間に続けて置かれている。","q":"このリズムが生みやすい感じは？","choices":["基本の拍を保ちながら弱拍や拍の間を強調し、アクセントのずれによる推進感を生む","拍の間を強調することで拍子そのものを消し、規則的な拍を感じられなくする","音価をそろえてリズムの変化を減らし、拍のずれを感じにくくする","アクセントの位置と同じ幅だけ旋律の音高も変化させ、音程の動きを強調する"],"correct":0,"why":"シンコペーションでは基本の拍を背景に、弱拍や拍の間へアクセントをずらす。拍とのずれがリズムの躍動感や前へ進む感じにつながる。"},{"subject":"音楽","grade":"中3","unit":"声部と模倣","passage":"第1声部が短い旋律を始め、その少し後から第2声部が同じ旋律を追いかけるように演奏する。","q":"二つの声部は、どのような関係になっている？","choices":["第1声部の旋律を、第2声部が時間をずらして模倣している","二つの声部が最初から同時に同じ旋律を奏でるユニゾンである","第1声部が旋律、第2声部が一定の和音だけを刻む伴奏である","二つの声部が交互に一度ずつ演奏し、同時には鳴らない"],"correct":0,"why":"同じ旋律が時間差で別の声部に現れているので「模倣」と捉えられる。カノンはこの仕組みを明確に用いる例。"},{"subject":"音楽","grade":"中3","unit":"フレーズと表現","passage":"8小節の旋律を歌う。4小節目の終わりには長い音があり、その直後から似たリズムで新しいまとまりが始まっている。","q":"4小節目の後を呼吸位置と考えられる手掛かりは？","choices":["長い音のあとに新しいまとまりが始まり、旋律の区切りとして捉えやすいこと","4小節目だから呼吸位置と考えられ、旋律のまとまりは確認しなくてよいこと","長い音は途中で短く切るための記号なので、その音の途中で呼吸できること","似たリズムが続いているため、8小節全体を一つの息で歌う方が自然であること"],"correct":0,"why":"呼吸位置は小節番号だけで決めず、旋律のまとまりで考える。長い音のあとに新しいまとまりが始まるため、4小節目の後は区切りとして捉えやすい。"},{"subject":"音楽","grade":"中3","unit":"変奏","passage":"Aでは基本の旋律を示す。A'では装飾音を加えてリズムを細かくし、A''では伴奏や音色を大きく変えているが、旋律の大まかな音の上がり下がりは残っている。","q":"A'やA''をAの「変奏」と捉えられる手掛かりは？","choices":["伴奏や音色が変わっても、元の旋律を思い出せる共通した特徴が残っていること","三つの部分で使う楽器と音色が変わらず、演奏する音も同じであること","A'以降では元の旋律を使わず、毎回まったく別の材料から作っていること","変奏するたびに拍子記号を変え、元の曲との共通点をなくしていくこと"],"correct":0,"why":"変奏では、元の旋律を感じさせる特徴を残しながら、リズム・伴奏・音色などを変える。共通性があるからこそ、変化した部分も「同じ主題の変奏」として聞き取れる。"},{"subject":"音楽","grade":"中3","unit":"創作・モチーフ","passage":"4音の短いモチーフをもとに、8小節の旋律をつくる。","q":"元のモチーフの特徴を残しながら、まとまりと変化の両方をつくる構成は？","choices":["元のモチーフ → リズムを少し変える → 元の特徴を戻す → 終わり方を変える","元のモチーフ → 同じ形をそのまま反復 → 同じ反復 → 同じ反復","元のモチーフ → 共通点のない新しい音型 → さらに別の音型 → 別の音型","元のモチーフ → 毎小節で音の並びを変える → さらに別の音型 → 最後も別の音型"],"correct":0,"why":"元のモチーフと分かる特徴を繰り返し示しながら、リズムや終わり方の一部を変えると、同じ材料によるまとまりと変化を両立しやすい。"},{"subject":"音楽","grade":"中3","unit":"合奏と解釈","passage":"総譜どおり主旋律をmf、伴奏をpで演奏したが、主旋律が低い音域へ移った部分では録音を聞くと旋律が埋もれていた。","q":"次の合奏では、どのように改善するとよい？","choices":["強弱記号を出発点にし、録音で主旋律が聞こえるよう伴奏との実際のバランスを調整する","mfとpの記号どおりなら十分なので、録音で聞こえにくくても音量は変えない","低音域の主旋律を目立たせるため、伴奏も同じ程度まで大きくして厚みを出す","音量差は変えず、聞き取りにくい部分だけテンポを遅くして主旋律を目立たせる"],"correct":0,"why":"強弱記号は目安だが、音域や音色によって実際の聞こえ方は変わる。録音で旋律が埋もれているなら、役割が伝わるようバランスを耳で確かめて調整する必要がある。"},{"subject":"音楽","grade":"中3","unit":"日本の伝統音楽・雅楽","passage":"笙・篳篥・龍笛という三つの管楽器が用いられる。","q":"これらの楽器が代表的に用いられる日本の伝統音楽は？","choices":["雅楽","能の囃子","箏曲","歌舞伎の長唄"],"correct":0,"why":"笙・篳篥・龍笛は、管絃や舞楽など雅楽で中心的に用いられる管楽器。似た伝統芸能の楽器編成と区別して覚える。"},{"subject":"音楽","grade":"中3","unit":"日本の伝統芸能","passage":"舞台上で、謡や舞に加えて、能管・小鼓・大鼓・太鼓による囃子が関わって一つの表現をつくる。","q":"このように音楽と舞台表現が密接に結び付く伝統芸能は？","choices":["能","文楽","歌舞伎","雅楽"],"correct":0,"why":"能では、謡・舞と、能管・小鼓・大鼓・太鼓による囃子が一体となって舞台表現をつくる。楽器編成まで手掛かりにして他の伝統芸能と区別する。"},{"subject":"音楽","grade":"中3","unit":"世界の音楽文化","passage":"ある地域の合奏では、金属製の打楽器を複数人で演奏し、短い音型を組み合わせて厚い響きをつくる。祭礼で演奏される場合と舞台公演で演奏される場合がある。","q":"この音楽文化を理解するため、音の特徴とあわせて調べたいことは？","choices":["どの場で誰が演奏し、祭礼や地域社会の中でどのような意味をもつか","使われる音階やリズムを西洋音楽の分類だけに当てはめたときの一致度","楽器の材質や製作法だけを調べ、演奏される場や人との関わりは扱わない","録音会場の広さや機材だけを比較し、その地域での演奏の役割は考えない"],"correct":0,"why":"音楽文化は音そのものだけでなく、誰が・どこで・何のために演奏するかという社会的・文化的背景と結び付いている。"},{"subject":"音楽","grade":"中3","unit":"鑑賞・批評","passage":"ある曲では、①旋律が次第に高い音域へ進む、②pからfへ強くなる、③最後だけ急に弱くなる、という変化がある。","q":"この曲の特徴を根拠に、表現を説明しているのは？","choices":["音域の上昇とクレッシェンドで高まりをつくり、最後の急な弱音で落差と余韻を生んでいる","音域が高くなるにつれて調性も自動的に長調へ変わり、最後まで明るい印象を強めている","途中にfがあるため、前後のpや急な弱音に関係なく、曲全体を同じ強さで演奏している","最後が弱音になることで、それ以前の音域上昇やクレッシェンドの効果は打ち消されている"],"correct":0,"why":"①音域上昇と②クレッシェンドは高まりをつくり、③最後の急な弱音はそこからの落差と余韻を生む。複数の音楽要素を関連付けて説明するのが根拠のある鑑賞である。"}];


const ART_CURRICULUM=[{"subject":"美術","grade":"中1","unit":"色彩・明度","passage":"同じ赤系の色を、暗い赤から明るい赤へ段階的に変えている。","q":"主に変化している色の属性は？","choices":["色相","明度","彩度","材質"],"correct":1,"why":"同じ赤系のまま、暗い色から明るい色へ変化しているので、主に明度が変化している。色は色相・明度・彩度などの視点で捉えられる。"},{"subject":"美術","grade":"中1","unit":"色彩・色相環","passage":"色相環では、色が色みの近い順に輪のように並んでいる。","q":"色相環でほぼ向かい合う位置にある色どうしを何という？","choices":["補色","同系色","無彩色","中間色"],"correct":0,"why":"色相環で向かい合う関係の色を補色という。組み合わせると色相の対比が強く感じられやすい。"},{"subject":"美術","grade":"中1","unit":"構図と動き","passage":"同じ形を使った二つの構成がある。Aは水平・垂直を中心に、Bは斜め方向を強く使っている。","q":"動きや勢いをより感じさせたいとき、一般に効果的なのは？","choices":["B。斜めの方向が視線を動かし、画面に方向性や緊張感をつくりやすい","A。水平・垂直を中心にすると視線が安定するため、斜めより強い動勢が生まれやすい","A。方向の違いより形の数だけで動きが決まり、水平・垂直でも印象はほぼ同じになる","B。斜めは動きを感じさせやすいが、配置や反復の仕方は印象にほとんど影響しない"],"correct":0,"why":"斜めの方向は視線を画面内で動かし、水平・垂直中心の構図より動きや緊張感をつくりやすい。ただし印象は配置や色など他の要素にも左右される。"},{"subject":"美術","grade":"中1","unit":"遠近法","passage":"道路の両端や建物の線が、遠くへ行くほど一つの点に集まって見えるように描かれている。","q":"透視図法で、平行な線が集まって見える点を何という？","choices":["消失点","中心点","接点","対称点"],"correct":0,"why":"透視図法では、奥行き方向の平行線が画面上で集まって見える点を消失点という。奥行きを表す基本的な考え方の一つ。"},{"subject":"美術","grade":"中1","unit":"水彩表現","passage":"透明水彩の性質を生かして、光の当たる明るい部分を表したい。","q":"透明水彩の性質を生かすなら、どう描く？","choices":["紙の白を明るい部分として残し、薄い色から必要に応じて重ねる","明るい部分まで濃く塗ったあと、不透明な白を重ねて明部をつくる","最初に暗い色で全面を塗り、水でこすり落として紙の白へ戻す","絵の具の透明感を抑えるため水を少なくし、厚い色面で光を表す"],"correct":0,"why":"透明水彩は紙の白を透かして明るさを表せる。明部を残し、薄い色を重ねて調子を整えると透明感を生かしやすい。"},{"subject":"美術","grade":"中1","unit":"彫刻・立体","passage":"人物を、正面だけでなく横や後ろからも鑑賞できる立体作品として表したい。","q":"どの表現方法が適している？","choices":["丸彫り","浮き彫り","木版画","コラージュ"],"correct":0,"why":"丸彫りは像の周囲を立体としてつくり、さまざまな方向から鑑賞できる。浮き彫りは背景となる面から形を浮き上がらせる表現。"},{"subject":"美術","grade":"中1","unit":"伝えるデザイン","passage":"駅で、言葉の異なる多くの人に「この方向へ進む」という情報を短時間で伝えたい。","q":"この場面でピクトグラムを使う利点は？","choices":["形や記号を単純化し、文字に頼りすぎず情報を素早く伝えられる","文章より多くの細部情報を一つの記号だけで正確に伝えられる","文化や状況にかかわらず、どの記号も全員が同じ意味に受け取る","装飾性を高めることが主目的で、情報の理解しやすさは重視しない"],"correct":0,"why":"ピクトグラムは情報を単純な形へ整理し、言葉だけに頼らず素早く伝えるのに有効。ただし文化差や慣習もあるため、誰にでも自動的に同じ意味が伝わるわけではない。"},{"subject":"美術","grade":"中1","unit":"レイアウト","passage":"文化祭ポスターには「文化祭」「日時」「場所」「企画一覧」の四つの情報がある。見る人に最初に「文化祭」を認識してもらいたい。","q":"情報を減らさず、最初に「文化祭」へ視線を集めるには？","choices":["「文化祭」だけ文字サイズと明暗差を大きくし、周囲に余白を取る","四つの情報を同じくらいの大きさ・太さにして、強さの差を小さくする","「文化祭」を最も小さくし、企画一覧だけを中央に大きく置く","背景写真と文字の明度を近づけ、全情報を同じ強さで見せる"],"correct":0,"why":"情報の優先順位は、文字サイズ・明暗差・余白・配置などの差でつくれる。内容を削除しなくても、見出しを他より強く見せることで視線を誘導できる。"},{"subject":"美術","grade":"中1","unit":"日本の美術文化・浮世絵","passage":"多色刷りの木版画では、輪郭を表す版や色を表す版など、複数の版木を使って紙に刷り重ねる。","q":"複数の版木を使うことで、どのような表現が可能になる？","choices":["輪郭や色面など役割の異なる版を位置を合わせて刷り、複数の色を一画面に重ねられる","一枚の版を色ごとに彫り直し、前に刷った色を削りながら同じ紙へ重ねられる","色ごとに別の紙へ刷り、完成後に切り貼りすることで一枚の版画にまとめられる","同じ版を少しずつずらして刷り、色の位置が一致しないことを基本の表現にできる"],"correct":0,"why":"多色木版では、輪郭や各色に対応した複数の版を用い、見当を合わせて同じ紙へ刷り重ねることで多色の画面をつくる。"},{"subject":"美術","grade":"中1","unit":"鑑賞・根拠","passage":"作品には、太い斜線、繰り返される小さな円、広い余白が使われている。","q":"作品の特徴を根拠にしている鑑賞は？","choices":["斜線と円の反復が視線の動きをつくり、広い余白がその方向性をより際立たせている","斜線が多いことから、作者が速い乗り物を描こうとした作品だと断定できる","円が繰り返されていることから、作品の主題は宇宙や惑星だと断定できる","余白が広く残っていることから、制作途中で完成していない作品だと判断できる"],"correct":0,"why":"鑑賞では作者の意図を根拠なく断定せず、実際に見える形・方向・反復・余白などを基に、視線の動きや印象を説明する。"},{"subject":"美術","grade":"中2","unit":"色彩・対比","passage":"同じ明るさの灰色を、白い背景と黒い背景の上に置いて比べる。二つの灰色そのものは同じ色である。","q":"二つの灰色の見え方が違って感じられる主な理由は？","choices":["周囲の明るさとの対比によって見え方が変わるから","灰色そのものの色相が自動的に変わるから","黒い背景では光が存在しなくなるから","白い背景の上では灰色が透明になるから"],"correct":0,"why":"同じ色でも、周囲の色や明るさとの関係によって見え方は変化する。色彩は単独ではなく、組み合わせや対比によって印象が生まれる。"},{"subject":"美術","grade":"中2","unit":"二点透視","passage":"建物の角を正面にして見ると、左右に伸びる辺がそれぞれ別の方向へ遠ざかって見える。","q":"この立体感を表すのに適した透視図法は？","choices":["二点透視図法","一点透視図法","等角投影図","正面図だけを用いる正投影図"],"correct":0,"why":"建物の角を手前に見せると、左右へ伸びる二方向の平行線がそれぞれ別の消失点へ向かうため、二点透視図法が適している。"},{"subject":"美術","grade":"中2","unit":"写真・トリミング","passage":"同じ写真から、人物の顔を大きく切り取ったAと、周囲の風景まで広く残したBをつくった。","q":"トリミングによって変えられるものはどれ？","choices":["画面に残す範囲が変わるため、視線の集まる場所や被写体と周囲の関係が変わる","写真を切り取ると、撮影した人物の実際の大きさそのものが変化する","トリミングによって、撮影時の光の方向や時刻を後から変えられる","画面外を除くことで、被写体が実際にいた場所や距離まで変化する"],"correct":0,"why":"トリミングは画面に何を残し何を外すかを変える操作。注目点、周囲との関係、余白などが変わり、写真から受ける印象や意味も変わる。"},{"subject":"美術","grade":"中2","unit":"光と陰影","passage":"同じ球体に、Aでは正面から均一に光を当て、Bでは斜め上から一方向の光を当てている。","q":"球体の立体感をより強く表しやすいのは？","choices":["B。明部・暗部・落ちる影の差が、球の面の向きや奥行きを感じさせる","A。正面から均一に照らす方が、陰影の差が大きくなる","A。影を減らすほど、球の丸みを明暗から読み取りやすくなる","B。落ちる影があれば、球そのものの陰影はなくても同じ立体感になる"],"correct":0,"why":"一方向から光を当てると、球面に明部・暗部が生まれ、床には落ちる影ができる。これらの明暗関係が立体の形や位置を伝える。"},{"subject":"美術","grade":"中2","unit":"材料と表現","passage":"木の板には、一定方向に木目が走っている。木目を生かして小さな鳥の形を彫りたい。","q":"材料の特徴を生かす考え方はどれ？","choices":["木目の方向や硬さを確かめ、表したい形に合わせて彫る向きや用具を選ぶ","木目に逆らう方向を中心に彫ると、木目の影響を受けにくく均一に仕上がる","木材は紙と同じ性質なので、削る方向や力加減を変える必要はない","完成後に材料の特徴を確認すればよく、構想や加工方法には影響しない"],"correct":0,"why":"木材には木目・硬さ・割れやすさなどの性質がある。材料の特徴を確かめ、主題や形に応じて加工方向や用具を選ぶことが安全性と表現の両方につながる。"},{"subject":"美術","grade":"中2","unit":"プロダクトデザイン","passage":"毎日使うマグカップの取っ手を比べる。Aは指が入りにくく、Bは持ちやすい大きさで、本体の形とも調和している。","q":"Bの取っ手が使いやすいのはなぜ？","choices":["持ちやすさという機能と、本体との形のまとまりを両方考えているから","取っ手が大きいほど、使用者や本体の大きさに関係なく使いやすくなるから","使いやすさより装飾性を優先し、手で持つ機能を目立たなくしているから","機能と形を別々に考え、両者が影響しないよう設計しているから"],"correct":0,"why":"プロダクトデザインでは、使う人や用途に合う機能性と、形・素材・まとまりなどの美しさを関連付けて考える。"},{"subject":"美術","grade":"中2","unit":"文字のデザイン","passage":"避難所案内を10m離れて読んでもらった。\nA：細く装飾の多い文字…正しく読めた割合42％\nB：太く装飾の多い文字…正しく読めた割合65％\nC：太く単純な文字…正しく読めた割合91％","q":"この結果から、読みやすさを高める方向として支持されるのは？","choices":["線を太くし、装飾を減らして字形を単純にする","線を細くしたまま装飾を増やし、文字ごとの差を大きくする","装飾の量は変えず、線をさらに細くして文字を軽く見せる","Cの結果が高いので、背景色や文字間隔など他の条件は検討しなくてよい"],"correct":0,"why":"A→Bでは線を太くすると正しく読めた割合が上がり、B→Cでは装飾を減らすとさらに上がっている。この条件では、太く単純な字形が読みやすさにつながったと判断できる。"},{"subject":"美術","grade":"中2","unit":"シンボルと統一感","passage":"学校行事のパンフレット、案内板、名札に、同じ形を基にしたマークと共通の色を使っている。","q":"この工夫によって期待できる効果は？","choices":["共通する形や色が、同じ行事に関係する情報だと認識する手掛かりになり、統一感も生む","共通の色を使えば、内容が違っても文字や説明をかなり省ける","共通のマークを使うと、それぞれが別の行事であることを強調できる","統一感を出すには、パンフレット・案内板・名札のレイアウトも同じ形にそろえる必要がある"],"correct":0,"why":"形や色などの共通要素を繰り返すと、関連性を認識しやすくなり、視覚的な統一感をつくれる。ただし媒体ごとの目的に応じたレイアウト調整は必要。"},{"subject":"美術","grade":"中2","unit":"日本の美術文化・屏風","passage":"屏風を平らに近く広げた場合と、折って角度をつけて立てた場合を比べると、絵の見え方だけでなく、人が通る空間の区切られ方も変わった。","q":"この比較から、屏風にはどのような特徴があると分かる？","choices":["絵画として見る対象であると同時に、置き方によって室内空間にも働きかける","建物に固定して使う壁画と同じで、置く角度を変えても機能は変わらない","表面の絵は装飾ではなく保護用なので、鑑賞する対象とは考えない","屏風は平らに広げた状態で鑑賞するもので、折ると絵の見え方が崩れてしまう"],"correct":0,"why":"屏風は絵画として鑑賞できる一方、折って自立させることで空間を仕切ったり、見る角度を変えたりできる。作品と生活空間の両方に関わる点が特徴。"},{"subject":"美術","grade":"中2","unit":"鑑賞・比較","passage":"同じ「静かな夜」を主題にした二作品がある。Aは暗い青の面が広く、月は小さく端にある。Bは大きな黄色い月を中央に置き、背景との明暗差も大きい。","q":"Bで月が強く目立つ根拠はどれ？","choices":["月の大きさ・中央配置・背景との明暗差がAより大きいこと","二作品とも月を描いているため、主題が同じであること","Bの作者が月を好きだった可能性があること","Aの方が暗い色を多く使っているという一点だけ"],"correct":0,"why":"鑑賞の説明は作品から確認できる造形的特徴を根拠にする。Bでは月の大きさ、中央配置、強い明暗差が視線を集める要因になる。"},{"subject":"美術","grade":"中3","unit":"主題と表現・強調","passage":"自画像では、手が実際より大きく描かれ、顔の輪郭がゆがみ、背景の細部は省略されている。作者は作品名を「不安」としている。","q":"画面に見える事実を根拠にした解釈は？","choices":["手や顔の形を強調・変形し、背景を省いて人物へ視線を集め、「不安」を強めている","手が大きいのは描写力が不足した証拠なので、主題との関係は考えられない","作品名に「不安」とあるため、形や構図を見なくても作者の気持ちを一つに決められる","背景を省略すると心理表現はできないため、作品名と画面は矛盾している"],"correct":0,"why":"「手が大きい」「輪郭がゆがむ」「背景を省略」という見える事実を、作品名と結び付けて解釈している。鑑賞では、作者の内面を断定するのではなく造形的な根拠を示すことが重要。"},{"subject":"美術","grade":"中3","unit":"色彩・アクセント","passage":"三つの案で同じ大きさの赤い円を置いた。\nA：鮮やかな赤＋鮮やかな橙の背景\nB：鮮やかな赤＋低彩度の青灰色の背景\nC：暗い赤＋暗い紫の背景","q":"赤い円を強いアクセントにできるのはどの案？","choices":["A","B","C","三案とも背景との関係にかかわらず同じ"],"correct":1,"why":"Bは鮮やかな赤と低彩度の青灰色の差が大きく、色相・彩度の対比によって小さな面積でもアクセントになりやすい。色は単独ではなく周囲との関係で目立ち方が変わる。"},{"subject":"美術","grade":"中3","unit":"材料と複合表現","passage":"「記憶の断片」を主題にする。候補材料には、重なりが透ける半透明紙、細い線を自由に曲げられる針金、過去の場面を具体的に示す写真の複写がある。","q":"材料の性質を「記憶の断片」という主題に生かしているのは？","choices":["写真を半透明紙で部分的に重ね、針金で離れた断片どうしをつなぐように構成する","写真を一列に並べ、半透明紙は下地として全面を覆い、針金は外枠だけに使う","半透明紙を何層も重ねて写真をほぼ見えなくし、針金は直線の支柱としてだけ使う","写真の複写だけを時系列に並べ、半透明紙と針金は材料感が異なるため使用しない"],"correct":0,"why":"半透明紙の「重なって透ける」性質、針金の「線でつなげる」性質、写真の具体性を、記憶が重なり断片どうしが結び付く主題へ対応させている。"},{"subject":"美術","grade":"中3","unit":"情報デザイン","passage":"避難経路Aは赤い実線と三角記号、経路Bは緑の破線と丸記号で示している。","q":"色だけでなく線種や記号も変える主な理由は？","choices":["色の見え方や白黒印刷でも区別できるよう、線種・形・記号な
